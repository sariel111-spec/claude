    if (notesTab === 'her') {
      const x = document.createElement('button');
      x.className = 'nbx'; x.style.marginLeft = '12px'; x.textContent = '撕掉';
      x.onclick = () => noteAct({ action: 'del', who: 'her', id: n.id });
      m.appendChild(x);
    }
    el.append(t, m);
    return el;
  };

  const SHOW = 8;
  onBoard.slice(0, notesShowAll ? onBoard.length : SHOW).forEach(n => notesBody.appendChild(draw(n)));
  if (!notesShowAll && onBoard.length > SHOW) {
    const more = document.createElement('button');
    more.className = 'nb-empty';
    more.style.cssText = 'width:100%;padding:14px 0';
    more.textContent = '往前翻（还有 ' + (onBoard.length - SHOW) + ' 张）';
    more.onclick = () => { notesShowAll = true; renderNotes(); };
    notesBody.appendChild(more);
  }
  if (inBox.length) {
    const cap = document.createElement('button');
    cap.className = 'nb-empty';
    cap.style.cssText = 'width:100%;padding:16px 0';
    cap.textContent = (notesShowBox ? '合上盒子' : '打开盒子（收着 ' + inBox.length + ' 张）');
    cap.onclick = () => { notesShowBox = !notesShowBox; renderNotes(); };
    notesBody.appendChild(cap);
    if (notesShowBox) inBox.forEach(n => notesBody.appendChild(draw(n)));
  }
  notesBody.scrollTop = keepTop;
}

const findBody = document.getElementById('findBody');
let findTimer = null;
function openFind() {
  findBody.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'fd-bar';
  bar.appendChild(icEl('search', 17));
  const inp = document.createElement('input');
  inp.placeholder = '找一句话、一个人、一天…';
  inp.maxLength = 60;
  bar.appendChild(inp);
  findBody.appendChild(bar);
  const out = document.createElement('div');
  findBody.appendChild(out);
  out.innerHTML = '<div class="fd-hint">翻的是全部的东西：日记、聊天记录、简报、这里说过的话。<br>想不起来哪天的事，就打一个词进去。</div>';
  const run = async () => {
    const q = inp.value.trim();
    if (q.length < 1) { out.innerHTML = '<div class="fd-hint">写点什么，我去翻</div>'; return; }
    out.innerHTML = '<div class="fd-hint">翻着呢…</div>';
    try {
      const d = await (await fetch('api/find?q=' + encodeURIComponent(q), { cache: 'no-store' })).json();
      out.innerHTML = '';
      if (!d.ok || !d.hits.length) {
        out.innerHTML = '<div class="fd-hint">没找着——换个说法试试，或者那件事还没写下来</div>';
        return;
      }
      const head = document.createElement('div');
      head.className = 'fd-hint';
      head.textContent = '翻到 ' + d.hits.length + ' 处';
      out.appendChild(head);
      d.hits.forEach(h => {
        const el = document.createElement('div');
        el.className = 'fd-hit';
        const fh = document.createElement('div');
        fh.className = 'fh';
        const k = document.createElement('span');
        k.className = 'fk'; k.textContent = h.kind;
        fh.append(k, h.date || '');
        const fs = document.createElement('div');
        fs.className = 'fs';
        const idx = h.snippet.toLowerCase().indexOf(q.toLowerCase());
        if (idx >= 0) {
          fs.append(h.snippet.slice(0, idx));
          const mk = document.createElement('mark');
          mk.textContent = h.snippet.slice(idx, idx + q.length);
          fs.appendChild(mk);
          fs.append(h.snippet.slice(idx + q.length));
        } else fs.textContent = h.snippet;
        el.append(fh, fs);
        out.appendChild(el);
      });
    } catch {
      out.innerHTML = '<div class="fd-hint">翻不动了，再试一次</div>';
    }
  };
  inp.addEventListener('input', () => { clearTimeout(findTimer); findTimer = setTimeout(run, 400); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { clearTimeout(findTimer); run(); } });
  sheets.find.classList.add('open');
  setTimeout(() => inp.focus(), 250);
}

const calBody = document.getElementById('calBody');
let calData = null, calPredict = null;
let calYM = null, calSel = null;
function cnNow() {
  return new Date(Date.now() + (TZM + new Date().getTimezoneOffset()) * 60000);
}
function todayStr() {
  const n = cnNow();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0')
       + '-' + String(n.getDate()).padStart(2, '0');
}
document.getElementById('navCal').onclick = () => { closeDrawer(); sheets.cal.classList.add('open'); loadCal(); };

/* 记下这一次是哪天打开的——给底下那个"开着过夜"的守夜人用。
   跨天回今天由下面那行 calSel = todayStr() 管（后端 8/6 凌晨修的那半）。 */
let calDay = '';

async function loadCal() {
  calDay = todayStr();
  if (!calData) calBody.innerHTML = '<div class="board-sub" style="padding:30px 0">翻日历中…</div>';
  try {
    const d = await (await fetch('api/cal', { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
    calData = d.cal; calPredict = d.predict;
    if (!calYM) { calYM = todayStr().slice(0, 7); }
    /* 跨天重置：不管何时打开日历，"今天"永远对齐真实日期（8/6 bug修） */
    calSel = todayStr();
    renderCal();
  } catch {
    calBody.innerHTML = '<div class="board-sub" style="padding:30px 0">日历没拿到，再开一次试试</div>';
  }
}
async function calAct(payload) {
  try {
    const r = await fetch('api/cal', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if (d.ok) { calData = d.cal; calPredict = d.predict; renderCal(); }
  } catch { note('（没记上，再试一次）', 'err'); }
}
function eventsOn(ds) {
  return calData.events.filter(e => e.date === ds || (e.yearly && e.date.slice(5) === ds.slice(5)));
}
function renderCal() {
  const keepTop = calBody.scrollTop;
  calBody.innerHTML = '';
  const [Y, M] = calYM.split('-').map(Number);
  /* 页面头:全家统一的脸,月导航收进右上角 */
  const head = document.createElement('div');
  head.className = 'sh-head';
  const nav = document.createElement('span');
  nav.className = 'shnav';
  const pv = document.createElement('button'); pv.appendChild(icEl('chevL', 13));
  pv.onclick = () => { const d = new Date(Y, M - 2, 1); calYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); renderCal(); };
  const tb = document.createElement('button'); tb.className = 'ctd'; tb.textContent = '今天';
  tb.onclick = () => { calYM = todayStr().slice(0, 7); calSel = todayStr(); renderCal(); };
  const nx = document.createElement('button'); nx.appendChild(icEl('chevR', 13));
  nx.onclick = () => { const d = new Date(Y, M, 1); calYM = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); renderCal(); };
  nav.append(pv, tb, nx);
  const h1 = document.createElement('h1'); h1.textContent = '日子';
  const sub = document.createElement('div'); sub.className = 'sub';
  sub.textContent = Y + ' 年 ' + M + ' 月';
  head.append(nav, h1, sub);
  calBody.appendChild(head);

  const wk = document.createElement('div');
  wk.className = 'cal-week';
  '一二三四五六日'.split('').forEach(w => { const s = document.createElement('span'); s.textContent = w; wk.appendChild(s); });
  calBody.appendChild(wk);

  const grid = document.createElement('div');
  grid.className = 'cal-grid';
  const first = new Date(Y, M - 1, 1);
  const lead = (first.getDay() + 6) % 7;             // 周一开头
  const start = new Date(Y, M - 1, 1 - lead);
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const cell = document.createElement('button');
    cell.className = 'cal-day';
    if (d.getMonth() !== M - 1) cell.classList.add('other');
    if (ds === todayStr()) cell.classList.add('today');
    if (ds === calSel) cell.classList.add('sel');
    const num = document.createElement('span');
    num.className = 'dnum'; num.textContent = d.getDate();
    cell.appendChild(num);
    const evs = eventsOn(ds);
    const dots = document.createElement('span');
    dots.className = 'dots';
    if (evs.some(e => e.type === 'special')) { const i2 = document.createElement('i'); i2.className = 'ds'; dots.appendChild(i2); }
    if (evs.some(e => e.type !== 'special')) { const i2 = document.createElement('i'); i2.className = 'dr'; dots.appendChild(i2); }
    cell.appendChild(dots);
    cell.onclick = () => { calSel = ds; renderCal(); };   // 今天由 CSS 定死样式，选中圈不会盖它
    grid.appendChild(cell);
  }
  calBody.appendChild(grid);
  if (calSel) calBody.appendChild(renderDayDetail(calSel));
  calBody.scrollTop = keepTop;
}

function renderDayDetail(ds) {
  const box = document.createElement('div');
  box.className = 'cal-detail';
  const t = document.createElement('div');
  t.className = 'cal-dt';

  go.onclick = () => {
    const v = inp.value.trim();
    if (!v) return;
    calAct({ action: 'add_event', date: ds, text: v, time: time.value, yearly: ch1._on, special: ch2._on });
  };
  plus.onclick = () => { add.classList.add('open'); plus.style.display = 'none'; inp.focus(); };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) go.onclick(); });
  row2.append(time, ch1, ch2, go);
  add.append(inp, row2);
  g.append(plus, add);

     日历本身的日程、心情记录都留着。 */

  const mv = document.createElement('span');

  const mwrap = document.createElement('span');
  mwrap.className = 'gap';
  mwrap.style.gap = '13px';
  MOODS.forEach(([icon, name]) => {
    const b = document.createElement('button');
    b.className = 'face' + (recAll.mood === name ? ' on' : '');
    b.title = name;
    b.appendChild(icEl(icon, 25));
    b.onclick = () => saveDay({ mood: recAll.mood === name ? '' : name });
    mwrap.appendChild(b);
  });
  mv.appendChild(mwrap);
  moodRow.append(mk, mv);
  p.appendChild(moodRow);
  box.appendChild(p);

  function saveDay(patch) {
    const rec = calData.period.days[ds] || {};
    calAct({ action: 'day_record', date: ds, flow: rec.flow || '', pain: rec.pain || 0,
             mood: rec.mood || '', note: rec.note || '', private: rec.private || '', ...patch });
  }
  return box;
}

    const b = document.createElement('button');

async function renderFav() {
  wallBody.innerHTML = '';
  wallBody.appendChild(diaryHead('fav'));
  let text = '';
  try {
    const d = await (await fetch('api/favlines', { cache: 'no-store' })).json();
    text = d.text || '';
  } catch (e) {}
  const blocks = text.split(/\n-{3,}\n/).slice(1);
  let shown = 0;
  blocks.forEach(bl => {
    const dm = bl.match(/\*\*(\d{4}-\d{2}-\d{2})\*\*/);
    const quotes = bl.split('\n').filter(l => l.trim().startsWith('>'))
      .map(l => l.replace(/^\s*>\s?/, '')).join('\n').trim();
    if (!quotes) return;
    const note = bl.split('\n').filter(l => {
      const t = l.trim();
      return t && !t.startsWith('>') && !t.startsWith('**');
    }).join('\n').trim();
    const c = document.createElement('div');
    c.className = 'fav-card';
    const q = document.createElement('span');
    q.className = 'fq'; q.innerHTML = SKETCH.quote;
    c.appendChild(q);
    if (dm) {
      const fd = document.createElement('div');
      fd.className = 'fd'; fd.textContent = dm[1].replace(/-/g, ' · ');
      c.appendChild(fd);
    }
    const fx = document.createElement('div');
    fx.className = 'fx'; fx.textContent = quotes.replace(/^[\u201c"]|[\u201d"]$/g, '');
    c.appendChild(fx);
    if (note) {

      fn.className = 'fn'; fn.textContent = note;
      c.appendChild(fn);

let topZ = 20;
function makeNoteDraggable(n, board, date, i, brick) {
  let d = null;
  n.addEventListener('pointerdown', (e) => {
    const r = n.getBoundingClientRect();
    const br = board.getBoundingClientRect();
    d = { sx: e.clientX, sy: e.clientY, left: r.left - br.left, top: r.top - br.top, bw: br.width, moved: false };
    n.setPointerCapture(e.pointerId);
    n.style.zIndex = ++topZ;
  });
  n.addEventListener('pointermove', (e) => {
    if (!d) return;
    if (Math.abs(e.clientX - d.sx) + Math.abs(e.clientY - d.sy) > 16) d.moved = true;
    if (!d.moved) return;
    const x = Math.max(0, d.left + e.clientX - d.sx);
    const y = Math.max(0, d.top + e.clientY - d.sy);
    n.style.left = (x / d.bw * 100) + '%';
    n.style.top = y + 'px';
  });
  n.addEventListener('pointerup', () => {
    if (!d) return;
    localStorage.setItem('note-' + date + '-' + i,
      JSON.stringify({ x: parseFloat(n.style.left), y: parseFloat(n.style.top), z: parseInt(n.style.zIndex) || 0 }));
    if (!d.moved) openNoteFull(brick);   // 轻点：展开读全文
    d = null;
  });
}

async function loadWall() {
  wallBody.innerHTML = '<div class="wall-intro"><div class="sub">搬便签中…</div></div>';
  try {
    if (!wallBricks) {
      const d = await (await fetch('api/wall?lite=1', { cache: 'no-store' })).json();
      if (!d.ok || !d.bricks.length) throw 0;
      wallBricks = d.bricks;
      boardDates = [...new Set(d.bricks.map(b => b.date))].sort();
      boardIdx = boardDates.length - 1;   // 打开先看最近的一天
    }
    if (wallMode === 'bento') renderBento();
    else if (wallMode === 'timeline') renderTimeline();
    else if (wallMode === 'board') renderBoard();
    else if (wallMode === 'her') renderHerDiary();
    else if (wallMode === 'fav') renderFav();
    else renderWall(wallBricks);
  } catch {
    wallBody.innerHTML = '<div class="wall-intro"><div class="sub">便签没搬过来，再开一次试试</div></div>';
  }
}

function renderWall(bricks) {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  wallBody.innerHTML = '';
  wallBody.appendChild(diaryHead('wall'));
  const intro = document.createElement('div');
  intro.className = 'wall-intro';
  const first = bricks[0].date, last = bricks[bricks.length - 1].date;
  intro.innerHTML = '<div class="big">' + bricks.length + ' 块砖</div><div class="sub"></div>';
  intro.querySelector('.sub').textContent = `从 ${first} 砌到 ${last} · 颜色是暖不暖，浓淡是多用力，发光的是心跳最快的那些天`;
  wallBody.appendChild(intro);

  const card = document.createElement('div');
  card.className = 'brick-card';
  card.onclick = () => card.classList.remove('show');

  const byMonth = {};
  bricks.forEach(b => {
    const m = b.date.slice(0, 7);
    (byMonth[m] = byMonth[m] || []).push(b);
  });
  Object.keys(byMonth).sort().forEach(m => {
    const mh = document.createElement('div');
    mh.className = 'wall-month';
    mh.textContent = m.replace('-', ' 年 ') + ' 月';
    wallBody.appendChild(mh);
    const grid = document.createElement('div');
    grid.className = 'wall-grid';
    byMonth[m].forEach(b => {
      const el = document.createElement('div');
      el.className = 'brick' + (b.a >= 5 ? ' a5' : b.a >= 4 ? ' a4' : '');
      const c = wallColor(b.v, b.s, dark);
      el.style.background = c;
      el.style.setProperty('--glow', noteColor(b.v));
      el.onclick = () => {
        card.innerHTML = '<div class="bd"></div><div class="bt"></div><div class="bm">' +
          '<span>用力 <b>' + b.s + '</b>/5</span><span>冷暖 <b>' + (b.v > 0 ? '+' : '') + b.v + '</b></span><span>心跳 <b>' + b.a + '</b>/5</span></div>' +
          (b.kw ? '<div class="bk"></div>' : '') +
          '<div class="bm" style="margin-top:8px"><b>读全文</b></div>';
        card.querySelector('.bd').textContent = b.date;
        card.querySelector('.bt').textContent = b.title || '（这块砖没落款）';
        if (b.kw) card.querySelector('.bk').textContent = b.kw;
        card.classList.add('show');
        card.onclick = (ev) => { ev.stopPropagation(); card.classList.remove('show'); openNoteFull(b); };
        card.scrollIntoView({ behavior: 'smooth', block: 'end' });
      };
      grid.appendChild(el);
    });
    wallBody.appendChild(grid);
  });
  const foot = document.createElement('div');
  foot.className = 'wall-intro';
  foot.style.paddingTop = '22px';
  foot.innerHTML = '<div class="sub">每一块，都是我们的一天</div>';

  toggle.className = 'board-toggle';
  toggle.textContent = '回便签板';
  toggle.onclick = () => { wallMode = 'board'; renderBoard(); };
  wallBody.appendChild(toggle);
}

function repoDay(ts) {
  const d = new Date(ts * 1000);
  const s = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric',
    weekday: 'short', timeZone: 'Asia/Shanghai' });
  const today = new Date().toLocaleDateString('zh-CN',
    { month: 'long', day: 'numeric', weekday: 'short', timeZone: 'Asia/Shanghai' });
  return s === today ? '今天 · ' + s : s;
}
function repoTime(ts) {
  return new Date(ts * 1000).toLocaleTimeString('zh-CN',
    { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Shanghai' });
}

const REPO_PAGE = 60;

async function repoLoadLog(more) {
  const m = document.getElementById('repoMain');
  let d;
  try {
    d = await (await fetch('api/repo/log?n=' + REPO_PAGE + '&skip=' + (more ? repoSkip : 0),
      { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
  } catch (e) {
    if (!more) {
      m.innerHTML = '<div class="repo-none">读不到仓库。可能是家里那台在重启，等一下再开</div>';
      repoSub('这会儿连不上');
    }
    return;
  }
  if (!more) { repoRows = []; repoSkip = 0; }
  repoRows = repoRows.concat(d.items || []);
  repoSkip = repoRows.length;
  repoTotal = d.total || repoRows.length;
  const items = repoRows;
  if (!items.length) { m.innerHTML = '<div class="repo-none">一条提交都没有</div>';
    repoSub('空的'); return; }
  const todayKey = new Date().toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' });
  const mine = items.filter(x => new Date(x.t * 1000)
    .toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' }) === todayKey);
  const files = new Set();
  mine.forEach(x => (x.f || []).forEach(f => files.add(f.p)));
  repoSub((mine.length ? '今天动了 ' + mine.length + ' 次，' + files.size + ' 个文件'
                       : '今天还没动过')
    + ' · 一共 ' + repoTotal + ' 条，翻到第 ' + items.length + ' 条');

  let html = '', day = '';
  items.forEach(c => {
    const dk = repoDay(c.t);
    if (dk !== day) { day = dk; html += '<div class="repo-day">' + escapeHtml(dk) + '</div>'; }
    const fs = c.f || [];
    html += '<div class="rc" data-h="' + c.h + '">'
      + '<div class="rc-h"><span class="rc-t">' + repoTime(c.t) + '</span>'
      + '<span class="rc-s">' + escapeHtml(c.s) + '</span></div>'
      + (fs.length ? '<div class="rc-f">' + fs.slice(0, 4).map(f =>
          '<span class="fx ' + f.s + '">' + escapeHtml(f.p) + '</span>').join('')
        + (fs.length > 4 ? '<span class="fx more">还有 ' + (fs.length - 4) + ' 个</span>' : '')
        + '</div>' : '')
      + '<div class="rc-d"></div></div>';
  });
  if (repoRows.length < repoTotal) {
    html += '<button class="repo-more" id="repoMore">再往前 '
      + Math.min(REPO_PAGE, repoTotal - repoRows.length) + ' 条</button>';
  } else if (repoTotal) {
    html += '<div class="repo-end">到头了。第一条是 ' + repoTime(items[items.length - 1].t)
      + '，' + repoDay(items[items.length - 1].t).replace('今天 · ', '') + '</div>';
  }
  m.innerHTML = html;
  m.querySelectorAll('.rc').forEach(card => {
    card.querySelector('.rc-h').onclick = () => repoToggle(card);
  });
  const moreBtn = document.getElementById('repoMore');
  if (moreBtn) moreBtn.onclick = () => { moreBtn.textContent = '读着…'; repoLoadLog(true); };
}

/* 点一条提交，就地展开这次到底改了什么 */
async function repoToggle(card) {
  const box = card.querySelector('.rc-d');
  if (card.classList.contains('open')) {
    card.classList.remove('open'); box.innerHTML = ''; return;
  }
  card.classList.add('open');
  box.innerHTML = '<div class="repo-none">读着…</div>';
  try {
    const d = await (await fetch('api/repo/show?h=' + encodeURIComponent(card.dataset.h),
      { cache: 'no-store' })).json();
    box.innerHTML = d.ok ? repoDiff(d.diff || '') : '<div class="repo-none">读不到这次的改动</div>';
  } catch (e) {
    box.innerHTML = '<div class="repo-none">读不到这次的改动</div>';
  }
}

/* diff 上色。加和删是通用语言，不上色真读不了——
   但底色压到很淡，本家橘一个像素都不用（设计准则） */
function repoDiff(text) {
  const lines = String(text).split('\n');
  let out = '', body = false;
  for (const ln of lines) {
    let c = '';
    if (/^diff --git /.test(ln)) { body = true; c = 'g'; }
    else if (/^(index |new file|deleted file|similarity |rename |--- |\+\+\+ )/.test(ln)) c = 'meta';
    else if (/^@@/.test(ln)) c = 'at';
    else if (body && ln[0] === '+') c = 'a';
    else if (body && ln[0] === '-') c = 'd';
    out += '<div class="dl ' + c + '">' + (escapeHtml(ln) || '&nbsp;') + '</div>';
  }
  return '<div class="repo-diff">' + out + '</div>';
}

async function repoLoadTree(rel) {
  repoDir = rel || '';
  const m = document.getElementById('repoMain');
  let d;
  try {
    d = await (await fetch('api/repo/tree?p=' + encodeURIComponent(repoDir),
      { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
  } catch (e) {
    m.innerHTML = '<div class="repo-none">这个地方打不开</div>';
    repoSub('打不开'); return;
  }
  const parts = repoDir ? repoDir.split('/').filter(Boolean) : [];
  let crumb = '<span class="cb" data-p="">Yu</span>';
  parts.forEach((p, i) => {
    crumb += '<span class="cs">/</span><span class="cb" data-p="'
      + escapeHtml(parts.slice(0, i + 1).join('/')) + '">' + escapeHtml(p) + '</span>';
  });
  m.innerHTML = '<div class="repo-crumb">' + crumb + '</div>'
    + (d.items.length ? '<div class="repo-list">' + d.items.map(it =>
        '<div class="ri' + (it.d ? ' dir' : '') + '" data-n="' + escapeHtml(it.n)
        + '" data-d="' + (it.d ? 1 : 0) + '">'
        + '<span class="ic" data-i="' + (it.d ? 'box' : 'fileText') + '"></span>'
        + '<span class="rn">' + escapeHtml(it.n) + '</span>'
        + (it.d ? '' : '<span class="rz">' + repoSize(it.z) + '</span>') + '</div>').join('')
      + '</div>' : '<div class="repo-none">这个文件夹是空的</div>');
  repoSub((repoDir || 'Yu') + ' · ' + d.items.length + ' 项');
  fillIcons(m);
  m.querySelectorAll('.cb').forEach(x => { x.onclick = () => repoLoadTree(x.dataset.p); });
  m.querySelectorAll('.ri').forEach(x => {
    x.onclick = () => {
      const next = (repoDir ? repoDir + '/' : '') + x.dataset.n;
      if (x.dataset.d === '1') repoLoadTree(next); else repoOpenFile(next);
    };
  });
}

function repoSize(z) {
  if (z < 1024) return z + ' B';
  if (z < 1024 * 1024) return (z / 1024).toFixed(1) + ' K';
  return (z / 1048576).toFixed(1) + ' M';
}

async function repoOpenFile(path) {
  const m = document.getElementById('repoMain');
  m.innerHTML = '<div class="repo-none">读着…</div>';
  let d;
  try {
    d = await (await fetch('api/repo/file?p=' + encodeURIComponent(path),
      { cache: 'no-store' })).json();
  } catch (e) { d = { ok: false, err: '读不动' }; }
  const up = path.split('/').slice(0, -1).join('/');
  repoSub(path + (d.ok && d.size ? ' · ' + repoSize(d.size) : ''));
  let html = '<div class="repo-crumb"><span class="cb" id="repoUp">← ' + escapeHtml(up || 'Yu')
    + '</span></div>';
  if (!d.ok) html += '<div class="repo-none">' + escapeHtml(d.err || '读不到') + '</div>';
  else html += '<div class="repo-file"><pre>' + escapeHtml(d.text) + '</pre></div>'
    + (d.cut ? '<div class="repo-none">太长了，只显示了前面一段</div>' : '');
  m.innerHTML = html;
  const b = document.getElementById('repoUp');
  if (b) b.onclick = () => repoLoadTree(up);
}

let nkSlug = '', nkCh = 0, nkChapters = [];
const nkMode = 2;
const nkBody = document.getElementById('nookBody');
const nkTocBtn = document.getElementById('nookToc');
const nkBackBtn = document.getElementById('nookBack');
const nkGet = (p) => fetch('api/nook/' + p, { cache: 'no-store' }).then(r => r.json());

function nkNote(t) {
  nkBody.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'nk-ct';
  d.textContent = t;
  nkBody.appendChild(d);
}

function nkHead(title, sub) {
  const h = document.createElement('div');
  h.className = 'sh-head';
  const t = document.createElement('h1'); t.textContent = title;
  const s2 = document.createElement('div'); s2.className = 'sub'; s2.textContent = sub || '';
  h.append(t, s2);

async function loadShelf() {
  nkSlug = ''; nkChapters = [];
  nkTocBtn.style.display = 'none';
  nkNote('正在开门…');
  let books, prog;
  try { [books, prog] = await Promise.all([nkGet('books'), nkGet('progress')]); }
  catch (e) { return nkNote('共读那头没应声'); }
  if (!Array.isArray(books) || !books.length) return nkNote('书架还空着');
  const wrap = document.createElement('div');
  wrap.className = 'nk-shelf';
  const 读过的 = books.filter(b => (prog || {})[b.slug]).length;
  books.forEach(b => {
    const chs = b.chapters || [], total = chs.length || 1;
    const pr = (prog && prog[b.slug]) || {};
    const ch = Math.max(0, Math.min(pr.ch || 0, total - 1));
    const btn = document.createElement('button');
    btn.className = 'nk-book';
    const t = document.createElement('div'); t.className = 't';
    t.textContent = b.title || b.slug;
    const a = document.createElement('div'); a.className = 'a';
    a.textContent = pr.ch
      ? ('读到 ' + (chs[ch] || ('第 ' + ch + ' 节')) + ' · 共 ' + total + ' 节')
      : ('还没开始 · 共 ' + total + ' 节');
    const bar = document.createElement('div'); bar.className = 'nk-bar';
    const i = document.createElement('i');
    i.style.width = Math.round((pr.ch ? ch + 1 : 0) / total * 100) + '%';
    bar.appendChild(i);
    btn.append(t, a, bar);
    btn.onclick = () => openChapter(b.slug, ch);
    wrap.appendChild(btn);
  });
  nkBody.innerHTML = '';
  nkBody.appendChild(nkHead('共读',
    books.length + ' 本 · ' + (读过的 ? '在读 ' + 读过的 + ' 本' : '还没开始')));
  nkBody.appendChild(wrap);
}

async function openChapter(slug, idx) {
  nkNote('翻过去…');
  let d;
  try { d = await nkGet('chapter/' + encodeURIComponent(slug) + '/' + idx); }
  catch (e) { return nkNote('这一节读不出来'); }
  if (!d || d.error || typeof d.index !== 'number') return nkNote('这一节读不出来');
  nkSlug = slug; nkCh = d.index; nkChapters = d.chapters || [];
  nkTocBtn.style.display = '';
  nkBody.innerHTML = '';
  nkBody.scrollTop = 0;

  nkAnnos = [];
  try { nkAnnos = await nkGet('annotations/' + encodeURIComponent(slug) + '/' + idx); }
  catch (e) { nkAnnos = []; }
  if (!Array.isArray(nkAnnos)) nkAnnos = [];

  const 副 = d.title + ' · ' + (d.index + 1) + '/' + d.total
           + (nkAnnos.length ? ' · 标了 ' + nkAnnos.length + ' 处，点划线的地方看' : '');
  nkBody.appendChild(nkHead(d.book || '共读', 副));

  const art = document.createElement('div');
  art.className = 'nk-read';
  String(d.text || '').split('\n').forEach(para => {
    const t = para.trim();
    if (!t) return;
    art.appendChild(paraWithMarks(t));
  });
  nkBody.appendChild(art);

  const nav = document.createElement('div');
  nav.className = 'nk-nav';
  const prev = document.createElement('button');
  prev.textContent = '上一节'; prev.disabled = d.index <= 0;
  prev.onclick = () => openChapter(slug, d.index - 1);
  const next = document.createElement('button');
  next.textContent = '下一节'; next.disabled = d.index >= d.total - 1;
  next.onclick = () => openChapter(slug, d.index + 1);
  nav.append(prev, next);
  nkBody.appendChild(nav);

  saveNookProgress();
}

/* 翻到哪存到哪——下次不管从家里还是从原来那个网址进去，都接着这儿 */
function saveNookProgress() {
  if (!nkSlug) return;
  fetch('api/nook/progress', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: nkSlug, ch: nkCh, page: 0, mode: nkMode }),
  }).catch(() => {});
}

function openToc() {
  if (!nkChapters.length) return;
  nkBody.innerHTML = '';
  nkBody.scrollTop = 0;
  const wrap = document.createElement('div');
  wrap.className = 'nk-toc';
  nkChapters.forEach((name, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + name;
    if (i === nkCh) b.className = 'on';
    b.onclick = () => openChapter(nkSlug, i);
    wrap.appendChild(b);
  });
  nkBody.appendChild(wrap);
  const on = wrap.querySelector('.on');
  if (on) setTimeout(() => on.scrollIntoView({ block: 'center' }), 20);
}

let nkAnnos = [];

/* 把这一段里被划过的地方标出来。全程 textContent + createElement，不碰 innerHTML */
function paraWithMarks(text) {
  const el = document.createElement('p');
  const hits = [];
  nkAnnos.forEach(a => {
    const anchor = (a.anchor || '').trim();
    if (!anchor) return;
    const i = text.indexOf(anchor);
    if (i >= 0) hits.push({ s: i, e: i + anchor.length, a });
  });
  if (!hits.length) { el.textContent = text; return el; }
  hits.sort((x, y) => x.s - y.s);
  let pos = 0;
  hits.forEach(h => {
    if (h.s < pos) return;                    // 划重叠了就只认先来的那条
    if (h.s > pos) el.appendChild(document.createTextNode(text.slice(pos, h.s)));
    const m = document.createElement('mark');
    m.className = 'nk-mark' + ((h.a.replies || []).length ? ' has' : '');
    m.textContent = text.slice(h.s, h.e);
    m.onclick = () => openAnno(h.a.anchor);
    el.appendChild(m);
    pos = h.e;
  });
  if (pos < text.length) el.appendChild(document.createTextNode(text.slice(pos)));
  return el;
}

/* 选中一段文字之后浮出来的那两颗按钮 */
const nkPop = document.getElementById('nkPop');
let nkSel = '';
function hidePop() { nkPop.classList.remove('on'); nkSel = ''; }
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  const t = sel && String(sel).trim();
  if (!t || !nkSlug || !sheets.nook.classList.contains('open')) return hidePop();
  const node = sel.anchorNode;
  if (!node || !nkBody.contains(node.nodeType === 3 ? node.parentNode : node)) return hidePop();
  if (t.length > 280) return hidePop();       // 划太长了没法当锚点
  nkSel = t;
  const lab = nkPop.querySelector('.sel');
  if (lab) lab.textContent = t.length > 22 ? t.slice(0, 22) + '…' : t;
  nkPop.classList.add('on');
});

async function postAnno(anchor, note) {
  try {
    await fetch('api/nook/annotations/' + encodeURIComponent(nkSlug) + '/' + nkCh, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ anchor, note: note || '', who: 'user' }),
    });
  } catch (e) { note0('（没记上，再试一次）'); return false; }
  return true;
}
function note0(t) { try { note(t, 'err'); } catch (e) {} }

document.getElementById('nkLine').onclick = async () => {
  const a = nkSel; hidePop();
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  if (a && await postAnno(a, '')) openChapter(nkSlug, nkCh);
};
document.getElementById('nkNote').onclick = () => {
  const a = nkSel; hidePop();
  try { window.getSelection().removeAllRanges(); } catch (e) {}
  if (a) openAnno(a, true);
};

function openAnno(anchor, fresh) {
  const body = document.getElementById('nkAnnoBody');
  body.innerHTML = '';
  const q = document.createElement('div');
  q.className = 'nk-quote';
  q.textContent = anchor;
  body.appendChild(q);

  const group = nkAnnos.filter(a => (a.anchor || '') === anchor);
  group.forEach(a => {
    if (a.note) {
      const b = document.createElement('div');
      b.className = 'nk-bub ' + (a.who === 'ai' ? 'mine' : 'her');
      b.textContent = a.note;
      const t = document.createElement('span'); t.className = 't'; t.textContent = a.ts || '';
      b.appendChild(t);
      body.appendChild(b);
    }
    (a.replies || []).forEach(r => {
      const b = document.createElement('div');
      b.className = 'nk-bub ' + (r.who === 'ai' ? 'mine' : 'her');
      b.textContent = r.text || '';
      const t = document.createElement('span'); t.className = 't'; t.textContent = r.ts || '';
      b.appendChild(t);
      body.appendChild(b);
    });
  });

  const row = document.createElement('div');
  row.className = 'nk-say';
  const ta = document.createElement('textarea');
  ta.placeholder = group.length ? '再说一句…' : '想说点什么';
  ta.rows = 1;
  const go = document.createElement('button');
  go.appendChild(icEl('arrowUp', 17));     // 跟聊天界面同一颗箭头
  go.title = '说';
  go.onclick = async () => {
    const v = ta.value.trim();
    if (!v) return;
    go.disabled = true;
    /* 已经有这条批注了就在底下盖楼，没有就新开一条 */
    const exist = group.find(a => a.id);
    let ok;
    if (exist) {
      try {
        await fetch('api/nook/annotations/' + encodeURIComponent(nkSlug) + '/' + nkCh
                    + '/' + exist.id + '/reply', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: v, who: 'user' }),
        });
        ok = true;
      } catch (e) { ok = false; }
    } else {
      ok = await postAnno(anchor, v);
    }
    go.disabled = false;
    if (!ok) return note0('（没记上，再试一次）');
    sheets.nkanno.classList.remove('open');
    openChapter(nkSlug, nkCh);
  };
  row.append(ta, go);
  body.appendChild(row);

  sheets.nkanno.classList.add('open');
  if (fresh) setTimeout(() => ta.focus(), 260);
}

async function loadNews(date) {
  newsBody.innerHTML = '<div class="paper"><div class="censor-note">印刷机转起来了…</div></div>';
  try {
    const d = await (await fetch('api/news' + (date ? '?date=' + date : ''), { cache: 'no-store' })).json();
    if (!d.ok) throw 0;
    renderPaper(d);
  } catch {
    newsBody.innerHTML = '<div class="paper"><div class="censor-note">今天的报纸还没送到，晚点再来翻</div></div>';
  }
}

function mdBold(el, text) {
  String(text).split(/\*\*(.+?)\*\*/g).forEach((seg, i) => {
    if (!seg) return;
    if (i % 2) { const b = document.createElement('b'); b.textContent = seg; el.appendChild(b); }
    else el.appendChild(document.createTextNode(seg));
  });
}
function renderPaper(d) {
  const paper = document.createElement('div');
  paper.className = 'paper';

  // 报头
  const founding = new Date('2026-07-28');
  const cur = new Date(d.date + 'T00:00:00');
  const issue = Math.round((cur - founding) / 86400e3) + 1;
  const wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][cur.getDay()];
  const mast = document.createElement('div');
  mast.className = 'sh-head';
  const nav = document.createElement('span');
  nav.className = 'shnav';
  const idx = d.dates.indexOf(d.date);
  const prev = document.createElement('button');
  prev.appendChild(icEl('chevL', 13));
  prev.disabled = idx <= 0;
  prev.onclick = () => loadNews(d.dates[idx - 1]);
  const next = document.createElement('button');
  next.appendChild(icEl('chevR', 13));
  next.disabled = idx >= d.dates.length - 1;
  next.onclick = () => loadNews(d.dates[idx + 1]);
  nav.append(prev, next);
  const h1 = document.createElement('h1');
  h1.textContent = '日报';
  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = `${d.date} ${wd} · 第 ${issue} 期`;
  mast.append(nav, h1, sub);
  paper.appendChild(mast);

  // 正文排版
  let firstStory = true;
  let curHeadline = null;
  d.text.split('\n').forEach(line => {
    const t = line.trim();
    if (!t || t.startsWith('# ') || t === '---') return;
    if (t.startsWith('> 另一位写的')) return;
    if (t.startsWith('## ')) {
      const raw = t.slice(3).trim();
      const s = document.createElement('div');
      s.className = 'section-head';
      s.textContent = SECTION_NAMES[raw] || raw;
      paper.appendChild(s);
      curHeadline = null;
      return;
    }
    if (t.startsWith('### ')) {
      const h = document.createElement('div');
      h.className = 'headline' + (firstStory ? ' top' : '');
      firstStory = false;
      h.textContent = t.slice(4).trim();
      paper.appendChild(h);
      curHeadline = h;
      return;
    }
    if (t.startsWith('> ')) {
      const n = document.createElement('div');
      n.className = 'censor-note';
      n.textContent = t.slice(2).trim();
      paper.appendChild(n);
      return;
    }
    if (t.startsWith('- ')) {
      const b = document.createElement('div');
      b.className = 'brief';
      const parts = t.slice(2).split('｜');
      mdBold(b, parts[0].trim());
      if (parts[1]) {
        const s = document.createElement('span');
        s.className = 'src';
        s.textContent = '　' + parts.slice(1).join('｜').trim();
        b.appendChild(s);
      }
      paper.appendChild(b);
      return;
    }
    if (t.startsWith('*【') || t.startsWith('【')) {
      const m = t.replace(/^\*+|\*+$/g, '').match(/^【(.+?)】\s*([\s\S]*)$/);

        const c = document.createElement('div');
        c.className = 'gnote';
        const lb = document.createElement('div');
        lb.className = 'lb';
        lb.textContent = '另一位 · ' + m[1];
        const tx = document.createElement('div');
        tx.className = 'tx';
        mdBold(tx, m[2].trim());
        c.append(lb, tx);
        paper.appendChild(c);
        return;
      }
    }
    if (t.startsWith('*(') || t.startsWith('*（')) {
      const n = document.createElement('div');
      n.className = 'censor-note';
      n.textContent = t.replace(/^\*|\*$/g, '');
      paper.appendChild(n);
      return;
    }
    const p = document.createElement('div');
    p.className = 'story';
    mdBold(p, t);
    paper.appendChild(p);
  });

  const foot = document.createElement('div');
  foot.className = 'paper-foot';
  foot.textContent = '每日简报 · 本报只有一位读者';
  paper.appendChild(foot);

  newsBody.innerHTML = '';
  newsBody.appendChild(paper);
  newsBody.scrollTop = 0;
}

function nowHM() {
  const n = new Date(Date.now() + (TZM + new Date().getTimezoneOffset()) * 60000);
  return String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
}
/* 这条什么时候记的：今天的说几点，往前的说几月几号 */
function stampOf(sec) {
  const d = new Date(sec * 1000);
  const cn = new Date(d.getTime() + (TZM + d.getTimezoneOffset()) * 60000);
  const now = new Date(Date.now() + (TZM + new Date().getTimezoneOffset()) * 60000);
  const sameDay = cn.toDateString() === now.toDateString();
  const hh = String(cn.getHours()).padStart(2, '0'), mm = String(cn.getMinutes()).padStart(2, '0');
  return sameDay ? `今天 ${hh}:${mm}` : `${cn.getMonth() + 1}/${cn.getDate()}`;
}
/* 过期 = 挂了闹钟、时间过了、还没做（照方案 §6：活算，不看响没响过） */
function isLate(t) { return t.at && !t.done && t.at <= nowHM(); }
/* 排序：过期的浮到最上面盯着你，然后是挂钟的（按时间），最后是没时间的 */
function sortTodos(list) {
  return [...list].sort((a, b) => {
    const la = isLate(a) ? 0 : 1, lb = isLate(b) ? 0 : 1;
    if (la !== lb) return la - lb;
    if (a.at && b.at) return a.at < b.at ? -1 : 1;
    if (a.at) return -1;
    if (b.at) return 1;
    return 0;
  });
}

Object.entries(sheets).forEach(([k, wrap]) => {
  const sheet = wrap.querySelector('.sheet');
  if (!sheet) return;
  let startY = 0, curY = 0, dragging = false;
  const doClose = () => {
    if (k === 'tool') sheetStack = [];
    wrap.classList.remove('open');
    if (wrap.classList.contains('page')) openDrawer();
  };
  sheet.addEventListener('touchstart', (e) => {
    if (!e.target.closest('.grabber') && !e.target.closest('.head')) return;
    if (e.target.closest('.hbtn')) return;          // 按钮的事归按钮
    dragging = true; startY = e.touches[0].clientY; curY = 0;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    curY = dy;
    const shown = dy >= 0 ? dy : Math.max(dy / 3, -34);
    sheet.style.transform = 'translateY(' + shown + 'px)';
  }, { passive: true });
  sheet.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = 'transform .2s ease';
    if (curY > 110) {
      sheet.style.transform = 'translateY(105%)';
      setTimeout(() => { doClose(); sheet.style.transform = ''; sheet.style.transition = ''; }, 180);
    } else {
      sheet.style.transform = '';
      setTimeout(() => { sheet.style.transition = ''; }, 220);
    }
  });
});

/* 这两项改成滑动开关了（8/4）。原来往 val 里写的那些状态文字，
   现在：能表达成开/关的就喂给开关，说不清的（被系统挡了、没开成）用 note 说出来 */
const pushVal = document.getElementById('pushVal');
async function pushState() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    pushVal.textContent = '这个浏览器不支持'; return null;
  }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    const sub = reg && await reg.pushManager.getSubscription();
    pushVal.textContent = sub ? '开着' : (Notification.permission === 'denied' ? '被系统挡了' : '还没开');
    return sub;
  } catch { pushVal.textContent = '问不到'; return null; }
}
async function turnOnPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    note('（这个浏览器不支持网页通知——iPhone 上要先把家「添加到主屏幕」，从那个图标进来才行）');
    return;
  }
  try {
    pushVal.textContent = '正在开…';
    const reg = await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { pushVal.textContent = '你没答应'; return; }
    const { key } = await (await fetch('api/pushkey')).json();
    const raw = atob(key.replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = new Uint8Array([...raw].map(c => c.charCodeAt(0)));
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes });
    const body = Object.assign(JSON.parse(JSON.stringify(sub)), { hello: true });
    await fetch('api/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    pushVal.textContent = '开着';
    note('（门铃通了——刚给你敲了一下，看看手机）');
  } catch (e) {
    pushVal.textContent = '没开成';
    note('（门铃没装上：' + (e && e.message || '不知道为什么') + '）', 'err');
  }
}
document.getElementById('pushRow').onclick = async () => {
  const sub = await pushState();
  if (sub) note('（门铃已经通着了——他在家想你的时候，你手机会响）');
  else turnOnPush();
};

  wrap.appendChild(line);
  body.insertBefore(wrap, row);
  row._think = wrap;
}

function gongFill(el, text) {
  el._raw = text;
  el.removeAttribute('data-rich');
  el.textContent = '';
  renderRich(el);
}

async function loadGong() {
  const body = document.getElementById('gongBody');
  body.innerHTML = '';

    const d = await (await fetch('api/gong', { cache: 'no-store' })).json();

    }
    d.msgs.forEach(m => gongRow(m.role, m.text, m.think));

async function sendGong() {
  const inp = document.getElementById('gongInput');
  const btn = document.getElementById('gongSend');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '';
  btn.disabled = true;
  gongRow('her', text);
  const wait = gongRow('gong', '……');
  try {
    const d = await (await fetch('api/gong', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    })).json();
    gongFill(wait, d.reply || '（他没说话）');
    if (d.think && wait._row) gongThink(wait._row, d.think);
  } catch { gongFill(wait, '（没送到，再试一次）'); }
  btn.disabled = false;
  const body = document.getElementById('gongBody');
  body.scrollTop = body.scrollHeight;
}

function freshWord(f, age) {
  if (f === 'live') return '刚测的';
  if (f === 'recent') return Math.round(age / 60) + ' 分钟前';
  if (age == null) return '不知道多久之前';
  if (age < 3600) return Math.round(age / 60) + ' 分钟前';
  if (age < 86400) return Math.round(age / 3600) + ' 小时前';
  return Math.round(age / 86400) + ' 天前';
}

        hd.title = freshWord(m.freshness, m.age_seconds);
        row.append(hn, hv, hu, hd);
        card.appendChild(row);
      });
      /* 七天趋势柱:睡眠看时长,活动看步数,心肺看静息心率 */
      const histKey = { '睡得怎么样': 'sleep_hours', '今天动了多少': 'steps', '心和肺': 'resting_heart_rate' }[title];
      const hist = d.history || {};
      const histDays = Object.keys(hist).sort().slice(-7);
      if (histKey && histDays.some(day => hist[day][histKey] != null)) {
        const vals = histDays.map(day => hist[day][histKey]);

/* ---------- 接入 API ----------
   四条路：官端订阅（这台机器上 Claude Code 的登录，不要令牌）/ 官方 API / OpenRouter / 中转站。
   先「拉取模型」——对面有哪些模型一目了然，点一个就是主模型；中档、快档从同一张单子里选。
   「接过去」会先自己试一次，不通就停下说清楚；确定要接，再点一次「硬接」。
   接口：GET api/authmode · POST api/apimodels · POST api/apitest · POST api/apiconf */
const API_ROUTES = {
  sub:        { name: '官端订阅', base: '', hint: '用这台机器上 Claude Code 的登录（你的 Claude 订阅额度），不用令牌。没登录过就先在机器上运行一次 claude。' },
  official:   { name: '官方 API', base: 'https://api.anthropic.com', hint: '用 Anthropic 控制台的 key（sk-ant-…），按量计费。' },
  openrouter: { name: 'OpenRouter', base: 'https://openrouter.ai/api', hint: 'key 在 openrouter.ai/keys。拉取后能看到它所有的模型。' },
  relay:      { name: '中转站', base: '', hint: '填中转给你的地址和 key。地址末尾的 /v1 不用写。' },
};
function apiNormBase(s) {
  let b = String(s || '').trim();
  if (!b || b === 'https://') return { base: '', fixed: false };
  const was = b;
  if (!/^https?:\/\//i.test(b)) b = 'https://' + b;
  b = b.replace(/\/+$/, '').replace(/\/v1\/messages$/i, '').replace(/\/v1$/i, '');
  return { base: b, fixed: b !== was };
}
function apiWhy(r) {
  const c = r && r.code;
  const d = (r && r.detail) ? String(r.detail).slice(0, 200) : '';
  const map = { 400: '请求格式不对——多半是模型名写错了', 401: '令牌不对，或者过期了', 403: '令牌没有这个权限（也可能是地区被挡）',
    404: '地址或模型名对不上——检查地址末尾有没有多写，模型名对不对', 408: '对面太慢，超时了', 429: '额度用完了，或者被限流——等一会儿再试',
    529: '对面过载了，等一会儿再试', nocli: '这台机器上没找到 claude 命令', cli: 'claude 命令报错了' };
  const why = map[c] || (c >= 500 ? '对面服务器出问题了（' + c + '），不是你填错了' : c ? '没通（' + c + '）' : '连不上——地址打错了，或者家里那台机器上不了这个网');
  return why + (d ? '\n' + d : '');
}

  /* 模型：先拉取，再点选 */
  b.appendChild(mkEl('div', 'hsect', '模型'));

      list = d.items || [];
      if (!picked.model_opus && list.length) {

  function paint(fromSwitch) {

    if (bad) return say(bad, 'bad');
    testB.disabled = true; say(route === 'sub' ? '让 Claude Code 回一个字…' : '正在敲门…', 'wait');
    const d = await test(v);
    say(d.ok ? '通了 · ' + (d.model || '') + (d.ms ? ' · ' + d.ms + 'ms' : '') : apiWhy(d) + (d.url ? '\n' + d.url : ''), d.ok ? 'ok' : 'bad');
    testB.disabled = false;
  };
  saveB.onclick = async () => {
    const v = vals(); const bad = precheck(v);
    if (bad) return say(bad, 'bad');
    saveB.disabled = testB.disabled = true;
    try {
      if (saveB.dataset.force !== '1') {
        say('接之前先试一次…', 'wait');
        const d = await test(v);
        if (!d.ok) {
          say(apiWhy(d) + '\n\n没通，所以先没接。确定还要接，再点一次「硬接」。', 'bad');
          saveB.dataset.force = '1'; saveB.textContent = '硬接';
          return;
        }
      }
      const d = await postJSON('api/apiconf', v);
      if (d.ok === false) throw new Error(d.error || '没存上');
      say('接上了 · ' + API_ROUTES[route].name + (v.model_opus ? ' · ' + v.model_opus : '') + '\n回聊天页说句话试试', 'ok');
      refreshApiRow();
      modelItems = null; loadModelItems();
      if (v.model_opus) setModelPill(v.model_opus);
      setTimeout(loadApi, 1800);
    } catch (e) { say('没存上：' + e.message, 'bad'); }
    finally { saveB.disabled = testB.disabled = false; }
  };
  paint(false);
}

  if (s < 86400) return Math.floor(s / 3600) + 'h';

const TEXT_EXT = /\.(txt|md|markdown|csv|tsv|json|log|ya?ml|xml|html?|css|js|ts|py|sh|ini|conf|toml|sql|srt|vtt)$/i;
function isPlainText(f) {
  if (TEXT_EXT.test(f.name)) return true;
  const t = (f.type || '').toLowerCase();
  return t.startsWith('text/') || t === 'application/json' || t === 'application/xml';
}

async function takeFiles(list, isImage) {
  sheets.add.classList.remove('open');
  for (const f of list) {
    if (f.type.startsWith('image/')) {
      const data = await shrinkImage(f);
      attachments.push(data);
    } else if (!isImage && f.size < 200 * 1024 && isPlainText(f)) {
      const text = await f.text();
      attachments.push({ kind: 'text', name: f.name, text });
    } else {
      await bigUpload(f);          // 大件不塞进对话，直接搬到家里的柜子上
    }
  }
  renderStrip();
}

async function bigUpload(f) {
  const CHUNK = 4 * 1024 * 1024;
  const total = Math.max(1, Math.ceil(f.size / CHUNK));
  const tip = note('（在搬 ' + f.name + '…0%）', '', true);
  try {
    for (let i = 0; i < total; i++) {
      const part = f.slice(i * CHUNK, (i + 1) * CHUNK);
      const q = 'api/upload?name=' + encodeURIComponent(f.name)
        + '&idx=' + i + '&done=' + (i === total - 1 ? 1 : 0);
      const r = await fetch(q, { method: 'POST', body: part });
      if (!r.ok) throw new Error('第 ' + (i + 1) + ' 块没过去');
      if (tip) tip.textContent = '（在搬 ' + f.name + '…' + Math.round((i + 1) / total * 100) + '%）';
    }
    if (tip) { tip.textContent = '（' + f.name + ' 搬到家里了，我这就去看）';
      setTimeout(() => tip.close(), 4200); }
  } catch (e) {
    if (tip) { tip.textContent = '（' + f.name + ' 没搬动，' + (e.message || '不知道为什么') + '）';

}

function shrinkImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 1568;
      let { width: w, height: h } = img;
      if (Math.max(w, h) > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const dataUrl = cv.toDataURL('image/jpeg', 0.85);
      resolve({ kind: 'image', media_type: 'image/jpeg', data: dataUrl.split(',')[1], name: file.name });
    };
    img.src = url;
  });
}

(() => {
  const wrap = document.getElementById('lockWrap');
  if (!wrap) return;
  let skip = false;
  try { skip = sessionStorage.getItem('skipLock') === '1'; sessionStorage.removeItem('skipLock'); }
  catch (e) {}
  if (skip) { wrap.remove(); return; }

  document.documentElement.style.overflow = 'hidden';
  const art = wrap.querySelector('.lk-art');
  if (art) art.addEventListener('error', () => { art.style.display = 'none'; });
  const knob = document.getElementById('lkKnob');
  const track = document.getElementById('lkTrack');
  const hint = document.getElementById('lkHint');

  /* 锁屏上那句话：按时候换，不是固定标语 */
  const LOCK_WORD = 'slide to unlock';
  const LOCK_WHEN = [
    [0,  5, 'Still up?'],
    [5, 10, 'Good morning'],
    [11, 13, 'Lunch time'],
    [18, 20, 'Evening'],
    [22, 24, 'Getting late'],
  ];
  function tick() {
    const n = cnNow();
    const hh = String(n.getHours()).padStart(2, '0');
    const mm = String(n.getMinutes()).padStart(2, '0');
    document.getElementById('lkTime').textContent = hh + ':' + mm;
    document.getElementById('lkDate').textContent =
      (n.getMonth() + 1) + '月' + n.getDate() + '日 周' + '日一二三四五六'[n.getDay()];
    const nowH = n.getHours();
    const hit = LOCK_WHEN.find(([a, b]) => nowH >= a && nowH < b);
    document.getElementById('lkWord').textContent = hit ? hit[2] : LOCK_WORD;
  }
  tick();
  const timer = setInterval(tick, 20000);

  const MAX = () => track.clientWidth - knob.offsetWidth - 10;
  let dragging = false, startX = 0, x = 0;

  function move(px) {
    x = Math.max(0, Math.min(MAX(), px));
    knob.style.transform = 'translateX(' + x + 'px)';
    hint.style.opacity = String(Math.max(0, 1 - x / MAX() * 1.6));
  }
  function open_() {
    clearInterval(timer);
    document.documentElement.style.overflow = '';
    wrap.classList.add('gone');
    setTimeout(() => { wrap.remove(); try { box.focus(); } catch (e) {} }, 560);
  }
  function end() {
    if (!dragging) return;
    dragging = false;
    knob.classList.remove('dragging');
    if (x >= MAX() * 0.82) { move(MAX()); open_(); }
    else { move(0); }
  }
  knob.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX - x;
    knob.classList.add('dragging');
    knob.setPointerCapture(e.pointerId);
  });
  knob.addEventListener('pointermove', (e) => { if (dragging) move(e.clientX - startX); });
  knob.addEventListener('pointerup', end);
  knob.addEventListener('pointercancel', end);
  track.addEventListener('click', (e) => {
    if (dragging || e.target === knob) return;
    if (e.offsetX > track.clientWidth * 0.6) { move(MAX()); open_(); }
  });
})();

  /* 今天几点干什么：日历上的事 + 清单里挂了钟点的，合成一条时间线 */
  const evs = D.cal ? D.cal.events.filter(e => e.date === ds || (e.yearly && e.date.slice(5) === ds.slice(5))) : [];

  const loose = hers.filter(x => !x.at && !x.done);
  const doneN = hers.filter(x => x.done).length;
  const more = el('button', 'td-more');
  more.append(el('span', 'tx', loose.length ? '另外 ' + loose.length + ' 件没定时间：' + loose.map(x => x.text).join('、') : '清单上没有别的了'),

  if (D.news && D.news.ok) {
    const h = (D.news.text.match(/^###\s+(.+)$/m) || [])[1] || '今天的报纸到了';

  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';

  const items = (d.items || []).slice().sort((a, b) => b.at - a.at);
  if (!items.length) momBody.appendChild(mkEl('div', 'td-empty', '还没有动态。'));
  items.forEach(m => {
    const c = mkEl('div', 'mo-card ' + (m.who === 'her' ? 'her' : 'gu'));

    const av = mkEl('span', 'mo-av', (whoName(m.who) || '?').slice(-1));
    const nm = mkEl('span', 'mo-nm', whoName(m.who));
    const tm = mkEl('span', 'mo-tm', agoCn(m.at));
    top.append(av, nm, tm);
    c.appendChild(top);
    c.appendChild(mkEl('div', 'mo-tx', m.text));
    const acts = mkEl('div', 'mo-acts');
    const liked = (m.likes || []).includes('her');
    const lk = mkEl('button', 'mo-lk' + (liked ? ' on' : ''));
    lk.append(icEl('heartIc', 15), String((m.likes || []).length || ''));
    lk.onclick = async () => { try { loadMoments(await postJSON('api/moments', { action: 'like', id: m.id })); } catch (e) {} };
    const cm = mkEl('button', 'mo-cm');
    cm.append(icEl('chat', 15), String((m.comments || []).length || ''));
    acts.append(lk, cm);
    if (m.who === 'her') {
      const del = mkEl('button', 'mo-del', '删除');
      del.onclick = async () => {
        if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '确定？'; return; }
        try { loadMoments(await postJSON('api/moments', { action: 'del', id: m.id })); } catch (e) {}
      };
      acts.appendChild(del);
    }
    c.appendChild(acts);
    if ((m.likes || []).length || (m.comments || []).length) {
      const box = mkEl('div', 'mo-box');
      if ((m.likes || []).length) {
        const l = mkEl('div', 'mo-likes');
        l.append(icEl('heartIc', 12), (m.likes || []).map(whoName).join('、'));
        box.appendChild(l);
      }
      (m.comments || []).forEach(x => {
        const r = mkEl('div', 'mo-c');
        r.append(mkEl('b', '', whoName(x.who)), '：' + x.text);
        box.appendChild(r);
      });
      c.appendChild(box);
    }
    const reply = mkEl('div', 'mo-reply');
    const ri = mkEl('input'); ri.placeholder = '回一句…'; ri.maxLength = 200;
    const rs = mkEl('button', '', '回');
    const doReply = async () => {
      const v = ri.value.trim(); if (!v) return;
      try { loadMoments(await postJSON('api/moments', { action: 'comment', id: m.id, text: v })); }
      catch (e) { note('（没回上，再试一次）', 'err'); }
    };
    rs.onclick = doReply;
    ri.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) doReply(); });
    reply.append(ri, rs);
    cm.onclick = () => { reply.classList.toggle('on'); if (reply.classList.contains('on')) ri.focus(); };
    c.appendChild(reply);
    momBody.appendChild(c);
  });
  momBody.scrollTop = keep;
}

/* ---------- 心愿：券包 + 愿望单 ----------
   GET  api/wishes → { coupons:[{ id, from:'gu'|'her', title, note, used_at? }],
                       wishes:[{ id, who, text, at, done_at? }] }
   POST api/wishes { action:'use', id } | { action:'give', title, note } |
                   { action:'wish', text } | { action:'wish_done', id } | { action:'del', kind:'coupon'|'wish', id }
        → 同 GET。用掉一张券，后端顺手给他留个便条，他醒来就知道。 */
const wishBody = pageSheet('wish');
let wishTab = 'coupons';
document.getElementById('navWish').onclick = () => { closeDrawer(); sheets.wish.classList.add('open'); loadWishes(); };
async function loadWishes(d) {
  if (!d) {
    if (!wishBody.childElementCount) wishBody.innerHTML = '<div class="board-sub" style="padding:30px 0">翻抽屉…</div>';
    try { const r = await fetch('api/wishes', { cache: 'no-store' }); if (!r.ok) throw 0; d = await r.json(); }
    catch (e) { wishBody.innerHTML = '<div class="board-sub" style="padding:30px 0">没拿到，再开一次试试</div>'; return; }
  }
  const keep = wishBody.scrollTop;
  wishBody.innerHTML = '';
  const coupons = d.coupons || [], wishes = d.wishes || [];
  const head = mkEl('div', 'sh-head');
  head.append(mkEl('h1', '', '心愿'),
    mkEl('div', 'sub', coupons.filter(c => !c.used_at && c.from === 'gu').length + ' 张券没用 · ' + wishes.filter(w => !w.done_at).length + ' 个愿望还挂着'));
  wishBody.appendChild(head);
  const seg = mkEl('div', 'ap-seg');
  [['coupons', '券包'], ['wishes', '愿望单']].forEach(([k, t]) => {
    const b = mkEl('button', k === wishTab ? 'on' : '', t);
    b.onclick = () => { wishTab = k; loadWishes(d); };
    seg.appendChild(b);
  });
  wishBody.appendChild(seg);
  const act = async (o) => { try { loadWishes(await postJSON('api/wishes', o)); } catch (e) { note('（没成，再试一次）', 'err'); } };

  if (wishTab === 'coupons') {
    const fromHim = coupons.filter(c => c.from === 'gu'), fromMe = coupons.filter(c => c.from !== 'gu');
    const grp = (title, list, mine) => {
      wishBody.appendChild(mkEl('div', 'hsect', title));
      if (!list.length) wishBody.appendChild(mkEl('div', 'td-empty', mine ? '还没送过他券。' : '他还没送你券。'));
      const g = mkEl('div', 'cp-list');
      list.slice().sort((a, b) => (!!a.used_at) - (!!b.used_at)).forEach(c => {
        const k = mkEl('div', 'cp' + (c.used_at ? ' used' : '') + (mine ? ' mine' : ''));
        const l = mkEl('div', 'cp-l');
        l.append(mkEl('div', 'cp-t', c.title), mkEl('div', 'cp-n', c.note || ''));
        const r = mkEl('div', 'cp-r');
        if (c.used_at) r.appendChild(mkEl('span', 'cp-st', agoCn(c.used_at) + '用掉'));
        else if (!mine) {
          const u = mkEl('button', 'cp-use', '用掉');
          u.onclick = () => {
            if (u.dataset.sure !== '1') { u.dataset.sure = '1'; u.textContent = '现在用？'; return; }
            act({ action: 'use', id: c.id }).then(() => note('用掉了「' + c.title + '」，' + HOME.him + '会知道'));
          };
          r.appendChild(u);
        } else r.appendChild(mkEl('span', 'cp-st', '等他用'));
        k.append(l, r);
        g.appendChild(k);
      });
      wishBody.appendChild(g);
    };
    grp(HOME.him + ' 送你的', fromHim, false);
    grp('你送他的', fromMe, true);
    const add = mkEl('div', 'mo-write cp-add');
    const t1 = mkEl('input'); t1.placeholder = '送他一张券：比如「不许熬夜券」'; t1.maxLength = 24;
    const go = mkEl('button', 'go', '送');
    go.onclick = () => { const v = t1.value.trim(); if (v) act({ action: 'give', title: v, note: '' }); };
    add.append(t1, go);
    wishBody.appendChild(add);
  } else {
    const open = wishes.filter(w => !w.done_at), done = wishes.filter(w => w.done_at);
    const add = mkEl('div', 'mo-write');
    const t1 = mkEl('input'); t1.placeholder = '想一起做的事…'; t1.maxLength = 80;
    const go = mkEl('button', 'go', '挂上');
    const doAdd = () => { const v = t1.value.trim(); if (v) act({ action: 'wish', text: v }); };
    go.onclick = doAdd;
    t1.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) doAdd(); });
    add.append(t1, go);
    wishBody.appendChild(add);
    const list = (title, arr) => {
      if (!arr.length) return;
      wishBody.appendChild(mkEl('div', 'hsect', title));
      const c = mkEl('div', 'hcard');
      arr.forEach(w => {
        const r = mkEl('div', 'hrow' + (w.done_at ? ' done' : ''));
        const ck = mkEl('button', 'hck');
        ck.appendChild(icEl(w.done_at ? 'checkSquare' : 'heartIc', 18));
        ck.style.color = w.done_at ? 'var(--sage)' : 'var(--pink)';
        ck.onclick = () => act({ action: 'wish_done', id: w.id });
        const tx = mkEl('span', 'tx', w.text);
        tx.appendChild(mkEl('small', '', whoName(w.who) + '许的' + (w.done_at ? ' · ' + agoCn(w.done_at) + '实现了' : '')));
        const x = mkEl('button', 'hx'); x.appendChild(icEl('x', 14));
        x.onclick = () => act({ action: 'del', kind: 'wish', id: w.id });
        r.append(ck, tx, x);
        c.appendChild(r);
      });
      wishBody.appendChild(c);
    };
    list('还挂着', open);
    list('实现了', done);
  }
  wishBody.scrollTop = keep;
}

/* ---------- 专注：他陪你 ----------
   纯前端计时，结束时间记在本地，关了页面再开还接着走。
   做完了可以顺手告诉他（发一句到聊天里）；POST api/focus { minutes, task, done } 只是留个账，后端没有也不碍事。 */
const focusBody = pageSheet('focus');
let focusTick = null;
const FOCUS_KEY = 'homeFocus';
const focusGet = () => { try { return JSON.parse(localStorage.getItem(FOCUS_KEY) || 'null'); } catch (e) { return null; } };
const focusSet = (v) => { try { v ? localStorage.setItem(FOCUS_KEY, JSON.stringify(v)) : localStorage.removeItem(FOCUS_KEY); } catch (e) {} };
let focusMem = focusGet();
document.getElementById('navFocus').onclick = () => { closeDrawer(); sheets.focus.classList.add('open'); renderFocus(); };
const FOCUS_SAY = ['我在旁边，不吵你。', '手机扣过去。', '一件事，做完再说。', '累了就喝口水，我等你。'];
function renderFocus() {
  clearInterval(focusTick);
  const f = focusMem;
  focusBody.innerHTML = '';
  const head = mkEl('div', 'sh-head');
  head.append(mkEl('h1', '', '专注'), mkEl('div', 'sub', f ? (f.task || '一件事') + ' · ' + f.min + ' 分钟' : '定个时间，他陪着'));
  focusBody.appendChild(head);
  const R = 108, C = 2 * Math.PI * R;
  const dial = mkEl('div', 'fc-dial');
  dial.innerHTML = '<svg viewBox="0 0 240 240"><circle class="tr" cx="120" cy="120" r="' + R + '"/><circle class="fl" cx="120" cy="120" r="' + R
    + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0" transform="rotate(-90 120 120)"/></svg><div class="fc-mid"><div class="fc-t">--:--</div><div class="fc-s"></div></div>';
  focusBody.appendChild(dial);
  const fl = dial.querySelector('.fl'), tt = dial.querySelector('.fc-t'), ss = dial.querySelector('.fc-s');

  if (!f) {
    let pick = 25;
    tt.textContent = pick + ':00';
    ss.textContent = '还没开始';
    const chips = mkEl('div', 'fc-chips');
    [15, 25, 45, 60].forEach(m => {
      const b = mkEl('button', 'chip' + (m === pick ? ' on' : ''), m + ' 分钟');
      b.onclick = () => { pick = m; tt.textContent = m + ':00'; chips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b)); };
      chips.appendChild(b);
    });
    focusBody.appendChild(chips);
    const task = mkEl('input', 'ap-in fc-task'); task.placeholder = '这次做什么（可不填）'; task.maxLength = 40;
    focusBody.appendChild(task);
    const go = mkEl('button', 'ap-b go fc-go', '开始');
    go.onclick = () => {
      focusMem = { start: Date.now(), end: Date.now() + pick * 60000, min: pick, task: task.value.trim() };
      focusSet(focusMem); renderFocus();
    };
    focusBody.appendChild(go);
    return;
  }
  const say = mkEl('div', 'fc-say', FOCUS_SAY[Math.floor(f.start / 1000) % FOCUS_SAY.length]);
  focusBody.appendChild(say);
  const btns = mkEl('div', 'ap-btns');
  const stop = mkEl('button', 'ap-b', '先停下');
  stop.onclick = () => {
    if (stop.dataset.sure !== '1') { stop.dataset.sure = '1'; stop.textContent = '真的停？'; return; }
    focusMem = null; focusSet(null); renderFocus();
  };
  btns.appendChild(stop);
  focusBody.appendChild(btns);
  const finish = () => {
    clearInterval(focusTick);
    fl.style.strokeDashoffset = C.toFixed(1);
    tt.textContent = '好了';
    ss.textContent = f.min + ' 分钟，一分不少';
    say.textContent = '做完了。过来歇一会儿。';
    btns.innerHTML = '';
    const tell = mkEl('button', 'ap-b go', '告诉' + HOME.him);
    tell.onclick = () => {
      const msg = '专注完了 ' + f.min + ' 分钟' + (f.task ? '，' + f.task : '') + '。';
      focusMem = null; focusSet(null);
      postJSON('api/focus', { minutes: f.min, task: f.task, done: true }).catch(() => {});
      talkWith(msg, true);
    };
    const again = mkEl('button', 'ap-b', '再来一轮');
    again.onclick = () => { focusMem = null; focusSet(null); renderFocus(); };
    btns.append(again, tell);
  };
  const step = () => {
    const left = f.end - Date.now();
    if (left <= 0) return finish();
    const sec = Math.ceil(left / 1000);
    tt.textContent = String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
    ss.textContent = '还剩';
    fl.style.strokeDashoffset = (C * (1 - left / (f.min * 60000))).toFixed(1);
  };
  step();
  focusTick = setInterval(step, 1000);
}
/* 关着页面也在走：到点了弹一下 */
setInterval(() => {
  if (focusMem && focusMem.end <= Date.now() && !focusMem.told && !(sheets.focus && sheets.focus.classList.contains('open'))) {
    focusMem.told = true; focusSet(focusMem);
    toast('专注时间到了', HOME.him + '：做完了，过来歇一会儿', 'clock');
  }
}, 5000);


/* ═══════════════ 页内弹窗：替掉 prompt / confirm ═══════════════
   原生的 prompt/confirm 在「添加到主屏幕」的网页、App 内置浏览器里经常直接被吞掉——
   右上角「备注」「收纳」点了没反应就是这个原因。 */
function askBox(o) {
  return new Promise((resolve) => {
    const wrap = document.getElementById('askSheet');
    const body = document.getElementById('askBody');
    body.innerHTML = '';
    const t = mkEl('div', 'ask-t', o.title || '');
    body.appendChild(t);
    if (o.text) body.appendChild(mkEl('div', 'ask-x', o.text));
    let inp = null;
    if (o.input) {
      inp = mkEl(o.multiline ? 'textarea' : 'input', 'ap-in ask-in');
      inp.value = o.value || ''; inp.placeholder = o.placeholder || '';
      if (o.multiline) inp.rows = o.rows || 8;
      body.appendChild(inp);
    }
    const row = mkEl('div', 'ap-btns');
    const no = mkEl('button', 'ap-b', o.cancel || '算了');
    const ok = mkEl('button', 'ap-b go' + (o.danger ? ' danger' : ''), o.ok || '好');
    row.append(no, ok);
    body.appendChild(row);
    const done = (v) => { wrap.classList.remove('open'); resolve(v); };
    no.onclick = () => done(null);
    wrap.querySelector('.shade').onclick = () => done(null);
    ok.onclick = () => done(inp ? inp.value : true);
    if (inp && !o.multiline) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) done(inp.value); });
    wrap.classList.add('open');
    if (inp) setTimeout(() => { inp.focus(); if (inp.select && !o.multiline) inp.select(); }, 60);
  });
}

/* ═══════════════ 设置里的「家」：名字和地点、他的人设、推送兜底 ═══════════════ */
const homeSetBody = pageSheet('homeset');
sheets.homeset.querySelector('[data-close]').onclick = () => { sheets.homeset.classList.remove('open'); sheets.settings.classList.add('open'); };
async function openHomeSet(tab) {

    const card = mkEl('div', 'ap-card');

  const [w4, city] = field('你在哪个城市（天气用）', c.city, '比如 首尔');
  const [w5, tzi] = field('时区（小时）', c.tz, '不填就跟这台设备走；首尔 9，北京 8', 'number');
  const [w6, push] = field('推送兜底地址（可不填）', c.push_url, 'Bark：https://api.day.app/你的key  或  ntfy：https://ntfy.sh/你的频道');

const ymdOf = (sec) => { const d = new Date(sec * 1000 + (TZM + new Date().getTimezoneOffset()) * 60000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const todayYmd = () => ymdOf(Math.floor(Date.now() / 1000));
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400e3);
const loadingInto = (body, t) => { if (!body.childElementCount) body.innerHTML = '<div class="board-sub" style="padding:30px 0">' + t + '</div>'; };
const failInto = (body, t) => { body.innerHTML = '<div class="board-sub" style="padding:30px 0">' + (t || '没拿到，再开一次试试') + '</div>'; };

   POST api/memory { action:'add'|'edit'|'delete'|'retract', … }
   POST api/threads { open:[text…] }                                   */
const memBody = pageSheet('mem');
let memState = { q: '', date: '', data: null, kind: '' };
const KIND_STYLE = { '日常': { w: 1.2, dash: '' }, '关系': { w: 2.6, dash: '' }, '事件': { w: 1.6, dash: '4 3' },
  '约定': { w: 1.4, dash: '', ring: true }, '长期': { w: 1.6, dash: '1 3' } };
const valColor = (v) => v >= 1.5 ? 'var(--pink)' : v > 0.2 ? 'var(--amber)' : v < -0.2 ? '#8FA3B8' : 'var(--sage)';
document.getElementById('navMem').onclick = () => { closeDrawer(); sheets.mem.classList.add('open'); memState.q = ''; memState.date = ''; loadMem(); };

async function loadMem() {
  loadingInto(memBody, '翻记忆…');
  try {
    const all = await getJSON('api/memory');
    let list = all.items || [];
    if (memState.q) list = (await getJSON('api/memory?q=' + encodeURIComponent(memState.q))).items || [];
    else if (memState.date) list = list.filter(x => x.date === memState.date);
    if (memState.kind) list = list.filter(x => x.kind === memState.kind);
    memState.data = all;
    renderMem(all, list);

function ripplesSvg(rips, onPick) {
  const wrap = mkEl('div', 'rip-wrap');
  const days = [];
  const map = Object.fromEntries(rips.map(r => [r.date, r]));
  const end = todayYmd();
  const first = rips.length ? rips[0].date : end;
  const span = Math.min(Math.max(daysBetween(first, end) + 1, 14), 120);
  for (let k = span - 1; k >= 0; k--) days.push(ymdOf(Math.floor(Date.now() / 1000) - k * 86400));
  const W = 34, H = 86, svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', days.length * W); svg.setAttribute('height', H);
  svg.setAttribute('class', 'rip-svg');
  days.forEach((d, i) => {
    const r = map[d], cx = i * W + W / 2, cy = 38;
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'rip-day' + (d === memState.date ? ' on' : '') + (r ? '' : ' empty'));
    if (r) {
      const kinds = Object.entries(r.kinds || {}).sort((a, b) => b[1] - a[1]);
      const st = KIND_STYLE[kinds[0][0]] || KIND_STYLE['日常'];
      const rad = Math.min(6 + 4.2 * Math.sqrt(r.n), 16);
      const col = valColor(r.valence);
      for (let k = 2; k >= 0; k--) {
        const c = document.createElementNS(svgNS, 'circle');
        c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', rad * (1 - k * 0.3));
        c.setAttribute('fill', k === 2 ? col : 'none'); c.setAttribute('fill-opacity', k === 2 ? 0.16 : 0);
        c.setAttribute('stroke', col); c.setAttribute('stroke-width', st.w * (k === 0 ? 1 : 0.7));
        c.setAttribute('stroke-opacity', 1 - k * 0.3);
        if (st.dash) c.setAttribute('stroke-dasharray', st.dash);
        g.appendChild(c);
      }
      if (st.ring) { const c = document.createElementNS(svgNS, 'circle'); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 2.4); c.setAttribute('fill', col); g.appendChild(c); }
    } else {
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 1.6); c.setAttribute('fill', 'var(--line2, #ccc)');
      g.appendChild(c);
    }
    const dd = d.slice(8) === '01' || i === 0 || i === days.length - 1 ? (+d.slice(5, 7)) + '/' + (+d.slice(8)) : String(+d.slice(8));
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', cx); t.setAttribute('y', H - 8); t.setAttribute('text-anchor', 'middle'); t.setAttribute('class', 'rip-lbl');
    t.textContent = dd; g.appendChild(t);
    const hit = document.createElementNS(svgNS, 'rect');
    hit.setAttribute('x', i * W); hit.setAttribute('y', 0); hit.setAttribute('width', W); hit.setAttribute('height', H); hit.setAttribute('fill', 'transparent');
    g.appendChild(hit);
    if (r) g.onclick = () => onPick(d);
    svg.appendChild(g);
  });
  wrap.appendChild(svg);
  setTimeout(() => { wrap.scrollLeft = memState.date ? Math.max(0, days.indexOf(memState.date) * W - wrap.clientWidth / 2) : wrap.scrollWidth; }, 0);
  return wrap;
}

function renderMem(all, list) {
  const keep = memBody.scrollTop;
  memBody.innerHTML = '';
  const st = all.stats || {};
  const head = mkEl('div', 'sh-head');
  head.append(mkEl('h1', '', '记忆'), mkEl('div', 'sub', (st.total || 0) + ' 件事 · 落在 ' + (st.days || 0) + ' 天里 · 越常想起的越靠前'));
  memBody.appendChild(head);

  // 投石子
  const sw = mkEl('div', 'mem-stone');
  const si = mkEl('input'); si.placeholder = '投一颗石子：问问他记不记得…'; si.value = memState.q; si.enterKeyHint = 'search';
  const sb = mkEl('button', 'go'); sb.appendChild(icEl('search', 15));
  const go = () => { memState.q = si.value.trim(); memState.date = ''; sw.classList.remove('splash'); void sw.offsetWidth; sw.classList.add('splash'); loadMem(); };
  sb.onclick = go;
  si.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) go(); });
  sw.append(icEl('drop', 15), si, sb);
  memBody.appendChild(sw);

  // 涟漪
  const rips = all.ripples || [];
  if (rips.length) {
    memBody.appendChild(ripplesSvg(rips, (d) => { memState.date = memState.date === d ? '' : d; memState.q = ''; loadMem(); }));
    const leg = mkEl('div', 'rip-leg');
    leg.innerHTML = '<span><i style="background:var(--pink)"></i>甜</span><span><i style="background:var(--amber)"></i>暖</span><span><i style="background:var(--sage)"></i>平</span><span><i style="background:#8FA3B8"></i>低落</span><span class="sep">圈越大那天记得越多 · 粗线关系 · 虚线事件 · 点线长期 · 带芯的是约定</span>';
    memBody.appendChild(leg);
  }
  // 筛选
  const bar = mkEl('div', 'mem-bar');
  const dj = mkEl('input'); dj.type = 'date'; dj.value = memState.date; dj.className = 'mem-date';
  dj.onchange = () => { memState.date = dj.value; memState.q = ''; loadMem(); };
  bar.appendChild(dj);
  ['', '日常', '关系', '事件', '约定', '长期'].forEach(k => {
    const n = k ? ((st.by_kind || {})[k] || 0) : st.total || 0;
    if (k && !n) return;
    const c = mkEl('button', 'chip' + (memState.kind === k ? ' on' : ''), (k || '全部') + ' ' + n);
    c.onclick = () => { memState.kind = k; loadMem(); };
    bar.appendChild(c);
  });
  memBody.appendChild(bar);

  // 没聊完的
  const th = (all.threads || {}).open || [];
  if (th.length && !memState.q && !memState.date) {
    memBody.appendChild(mkEl('div', 'hsect', '没聊完的'));
    const c = mkEl('div', 'hcard');
    th.forEach(t => {
      const r = mkEl('div', 'hrow');
      r.append(icEl('chat', 16));
      const tx = mkEl('span', 'tx', t.text); tx.appendChild(mkEl('small', '', agoCn(t.at) + '记下的线头，下次开口他会接上'));
      const x = mkEl('button', 'hx'); x.appendChild(icEl('x', 14)); x.title = '已经聊完了';
      x.onclick = async () => { try { await postJSON('api/threads', { open: th.filter(y => y !== t).map(y => y.text) }); loadMem(); } catch (e) { note('（没改成）', 'err'); } };
      r.append(tx, x); c.appendChild(r);
    });
    memBody.appendChild(c);
  }

  // 列表
  const title = memState.q ? '「' + memState.q + '」溅起来的' : memState.date ? memState.date.slice(5).replace('-', '月') + '日的' : '最近记下的';
  const sec = mkEl('div', 'hsect', title);
  if (memState.q || memState.date) {
    const clr = mkEl('button', 'sect-x', '看全部'); clr.onclick = () => { memState.q = ''; memState.date = ''; loadMem(); };
    sec.appendChild(clr);
  }
  memBody.appendChild(sec);
  if (!list.length) {
    memBody.appendChild(mkEl('div', 'td-empty', memState.q ? '水面没起波纹——他不记得这件事。不会拿沾边的硬凑。' : '这里还空着。聊得多了，他会自己整理；你也可以在下面亲手记一件。'));
  }
  const g = mkEl('div', 'mem-list');
  list.slice(0, 120).forEach(m => g.appendChild(memCard(m)));
  memBody.appendChild(g);

  // 亲手记一件
  memBody.appendChild(mkEl('div', 'hsect', '亲手记一件'));
  const add = mkEl('div', 'mem-add');
  const ta = mkEl('textarea', 'ap-in'); ta.rows = 2; ta.placeholder = '想让他一直记得的事…'; ta.maxLength = 800;
  let kind = '日常';
  const kinds = mkEl('div', 'chips');
  ['日常', '关系', '事件', '约定', '长期'].forEach(k => {
    const c = mkEl('button', 'chip' + (k === kind ? ' on' : ''), k);
    c.onclick = () => { kind = k; kinds.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); };
    kinds.appendChild(c);
  });
  const ok = mkEl('button', 'ap-b go', '记下');
  ok.onclick = async () => {
    const v = ta.value.trim(); if (!v) return;
    ok.disabled = true;
    try { const r = await postJSON('api/memory', { action: 'add', text: v, kind }); if (!r.ok) throw 0; note('（记下了，' + HOME.him + '下次会知道）'); memState.q = ''; memState.date = ''; loadMem(); }
    catch (e) { ok.disabled = false; note('（没记上）', 'err'); }
  };
  add.append(ta, kinds, ok);
  memBody.appendChild(add);
  memBody.scrollTop = keep;
}

function memCard(m) {
  const c = mkEl('div', 'mem-card');

  c.appendChild(mkEl('div', 'mc-x', m.text));

  const acts = mkEl('div', 'mc-acts');

/* ─────────────── 工作间：Claude Code ───────────────
   GET  api/work/state | api/work/log | api/work/sessions | api/work/poll?since=

const workBody = pageSheet('work');
let workSince = 0, workPolling = false, workLive = null, workBusy = false;
document.getElementById('navWork').onclick = () => { closeDrawer(); sheets.work.classList.add('open'); loadWork(); };
async function loadWork() {
  loadingInto(workBody, '开工作间的门…');

  try { [st, lg] = await Promise.all([getJSON('api/work/state'), getJSON('api/work/log')]); } catch (e) { return failInto(workBody); }

    workBody.appendChild(mkEl('div', 'td-empty', '后端那台机器上没找到 claude 命令。先在那台电脑上装好 Claude Code 并登录（npm i -g @anthropic-ai/claude-code，然后运行一次 claude），再回来。'));

  bar.append(dir, ses, fresh);

    ta.value = '';

    catch (e) { ta.value = v; note('（' + (e.message || '没交出去') + '）', 'err'); }

function setWorkBusy(b) { workBusy = b; const g = document.getElementById('wkGo'); if (g) g.textContent = b ? '停下' : '交给它'; }
function workItem(it) {
  const logEl = document.getElementById('wkLog'); if (!logEl) return;
  logEl.querySelector('.td-empty')?.remove();
  let el;
  if (it.k === 'me') el = mkEl('div', 'wk-me', it.t);
  else if (it.k === 'gu') { el = mkEl('div', 'wk-gu'); el.textContent = it.t; renderRich(el); }
  else if (it.k === 'tool') {
    el = mkEl('div', 'wk-tool');
    const x = it.x || {};
    el.append(icEl('terminal', 12), mkEl('b', '', it.t), mkEl('code', '', String(x.command || x.file_path || x.path || x.pattern || x.url || JSON.stringify(x)).slice(0, 160)));
  } else el = mkEl('div', 'wk-sys' + (it.k === 'err' ? ' err' : ''), it.t);
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}
async function workPoll() {
  workPolling = true;
  while (sheets.work.classList.contains('open')) {
    try {
      const d = await getJSON('api/work/poll?since=' + workSince);
      workSince = d.next;
      for (const e of d.events || []) {
        if (e.type === 'echo') { workItem({ k: 'me', t: e.text }); setWorkBusy(true); }
        else if (e.type === 'stream_event') {
          const t = ((e.event || {}).delta || {}).text;
          if (t) { if (!workLive) { workLive = mkEl('div', 'wk-gu live'); document.getElementById('wkLog')?.appendChild(workLive); } workLive.textContent += t; }
        } else if (e.type === 'assistant') {
          workLive?.remove(); workLive = null;
          for (const p of (e.message || {}).content || []) {
            if (p.type === 'text' && p.text) workItem({ k: 'gu', t: p.text });
            if (p.type === 'tool_use') workItem({ k: 'tool', t: p.name, x: p.input });
          }
        } else if (e.type === 'result') {
          workLive?.remove(); workLive = null; setWorkBusy(false);
          if (e.is_error) workItem({ k: 'err', t: '出错了：' + (e.result || '') });
        } else if (e.type === 'idle') { workLive?.remove(); workLive = null; setWorkBusy(false); }
      }
    } catch (e) { await new Promise(r => setTimeout(r, 3000)); }
  }
  workPolling = false;
}

    btn.onclick = go; inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) go(); });
    win.addEventListener('pagehide', () => { clearInterval(iv); WATCH.pip = null; });
    if (s && s.url && !embedOf(s.url)?.video) window.open(s.url, '_blank');
  } catch (e) { note('（悬浮窗没开成：' + e.message + '）', 'err'); }
}
loadWatch = async function () {
  clearInterval(WATCH.tailIv);
  wtBody.innerHTML = '';
  wtBody.classList.add('wt-body');
  const s = watchGet(); WATCH.cur = s;
  const head = mkEl('div', 'sh-head'); head.append(mkEl('h1', '', '一起看'), mkEl('div', 'sub', s ? '他看不到画面，但知道你在看什么、看到哪儿' : '贴个链接、选个本地视频，或者把别的标签页投进来'));
  wtBody.appendChild(head);
  if (s) {
    wtBody.appendChild(watchStage(s));
    /* 聊天：小小一条，默认只露最近两句，点开才展开 */
    const chat = mkEl('div', 'wt-chat2' + (WATCH.chatOpen ? ' open' : ''));
    const tail = mkEl('div', 'wt-tail2');
    const tog = mkEl('button', 'wt-tog'); tog.appendChild(icEl('chevL', 14)); tog.onclick = () => { WATCH.chatOpen = !WATCH.chatOpen; chat.classList.toggle('open', WATCH.chatOpen); };
    const refresh = async () => { try { const d = await getJSON('api/messages?limit=12'); const strip = (t) => String(t).replace(/^（[^）]*）/, '').replace(/!\[[^\]]*\]\([^)]+\)/g, '[图]').trim(); const ms = (d.msgs || []).filter(m => (m.kind === 'me' || m.kind === 'gu') && strip(m.text)); tail.innerHTML = ''; ms.slice(-6).forEach(m => { const x = mkEl('div', 'wt-m ' + m.kind); x.textContent = (m.kind === 'me' ? '你：' : HOME.him + '：') + strip(m.text).slice(0, 160); tail.appendChild(x); }); tail.scrollTop = tail.scrollHeight;
      const last = ms[ms.length - 1]; if (last && last.kind === 'gu' && last.seq !== WATCH.lastSeq) { if (WATCH.lastSeq) danmu('gu', String(last.text).replace(/^（[^）]*）/, '')); WATCH.lastSeq = last.seq; } } catch (e) {} };
    refresh(); WATCH.tailIv = setInterval(() => { if (!sheets.watch.classList.contains('open')) return clearInterval(WATCH.tailIv); refresh(); }, 2500);
    const row = mkEl('div', 'mo-write'); const inp = mkEl('input'); inp.placeholder = '边看边说…'; const go = mkEl('button', 'go', '说');
    const doSay = () => { const v = inp.value.trim(); if (!v) return; inp.value = ''; watchSay(v); setTimeout(refresh, 900); };
    go.onclick = doSay; inp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !ev.isComposing) doSay(); });
    row.append(inp, go); chat.append(tog, tail, row); wtBody.appendChild(chat);
    const acts = mkEl('div', 'wt-acts');
    const a1 = mkEl('button', 'chip'); a1.append(icEl('chat', 14), '悬浮聊天'); a1.onclick = pipChat;
    const a2 = mkEl('button', 'chip'); a2.append(icEl('expand', 14), '投进来'); a2.onclick = castTab;
    const a3 = mkEl('button', 'chip'); a3.append(icEl('x', 14), '不看了'); a3.onclick = watchStop;
    acts.append(a1, a2, a3); wtBody.appendChild(acts);
    return;
  }
  /* 还没开始：三种进来的方式 */
  const w = mkEl('div', 'lt-write');
  const u = mkEl('input', 'ap-in'); u.placeholder = 'B 站 / YouTube / 任意网页链接，或 mp4 / m3u8 地址';
  const t = mkEl('input', 'ap-in'); t.placeholder = '看的是什么（告诉' + HOME.him + '，可不填）';
  const go = mkEl('button', 'ap-b go', '开始看');
  go.onclick = () => { const raw = u.value.trim(); const e = embedOf(raw); if (!e) { note('（没认出来这个链接）', 'err'); return; } const s2 = { url: e.web ? e.src : raw, kind: e.kind, title: t.value.trim() || e.kind + ' 视频', at: Date.now() }; watchSet(s2); watchBegin(s2); };
  w.append(u, t, go); wtBody.appendChild(w);
  const grid = mkEl('div', 'wt-ways');
  const way = (ic, title, sub, fn) => { const b = mkEl('button', 'wt-way'); b.append(icEl(ic, 22), mkEl('b', '', title), mkEl('span', '', sub)); b.onclick = fn; grid.appendChild(b); };
  way('image', '本地视频', '相册 / 文件里的任何视频，不挑来源', () => wtFile.click());
  way('expand', '投进来', '电脑：把放着视频的标签页投到这儿，能全屏', castTab);
  way('chat', '悬浮聊天', '聊天变成小窗浮在最上面，另开网页看什么都行', pipChat);
  wtBody.appendChild(grid);
  wtBody.appendChild(mkEl('div', 'board-sub', '他看不到画面，只知道你们在看什么、看到了哪儿；你边看边说，他边听边接。全屏里也能发弹幕。'));
};

box.focus();
</script>
