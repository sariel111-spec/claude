<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>家</title>

<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* 夜间模式：跟随系统 / 常亮 / 常暗，三态轮换，记在本地。
   写在 <style> 前面执行，页面还没画就把皮穿好，不会闪一下白的。
   规矩：反转的只有底色、卡片、线、字这些"纸和墨"；
   本家橘、身体粉这种有身份的颜色两种模式下都不动——它们是记号，不是背景。 */
/* 家所在的时区（分钟）。先跟设备走，后端设置里填了 tz 就以那个为准 */
var TZM = -new Date().getTimezoneOffset();
(function () {
  try {
    var t = localStorage.getItem('homeTheme') || 'auto';
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #faf9f5;
    --card: #ffffff;
    --panel: #f0eee6;
    --line: #e8e5dc;
    --text: #2b2a27;
    --dim: #8a867c;
    --accent: #c96442;        
    --accent-soft: #d97757;
    --user-bubble: #f0eee6;
    --sage: #96B08F;          
    --sage-track: #E7EDE2;
    --pink-track: #F8E5DE;
    --green: #2e7d43;
    --red: #c0392b;
    --amber: #e3a13a;         
    --amber-track: #f5e6c8;
    --red-track: #f6d8d4;
    --overlay: rgba(40, 38, 34, .4);
    --serif: SerifNum, "Songti SC", "Noto Serif SC", Georgia, serif;
    --glass: color-mix(in srgb, var(--card) 70%, transparent);  /* 悬浮层玻璃度（顶栏/菜单——内容条 8/3 改用 --panel 实色） */
    --pink: #E5A192;          
  }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) {
      --bg: #262624; --card: #30302e; --panel: #383836; --line: #3d3d3a;
      --text: #f5f4ef; --dim: #a3a099; --user-bubble: #35353260;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
}
html[data-theme="dark"] {
      --bg: #262624; --card: #30302e; --panel: #383836; --line: #3d3d3a;
      --text: #f5f4ef; --dim: #a3a099; --user-bubble: #35353260;
      --sage: #A8C0A0; --sage-track: #3A423A; --pink-track: #4A3B34;
      --green: #6fbf85; --red: #e07a6a;
      --amber: #e8b45c; --amber-track: #4a4232; --red-track: #4d3a36;
      --overlay: rgba(0, 0, 0, .55);
    }
  
  @font-face {
    font-family: SerifNum;
    src: local("Helvetica Neue"), local("Helvetica");
    unicode-range: U+0030-0039, U+002F, U+002E, U+003A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    overflow-x: hidden; max-width: 100vw;   
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.7;
    font-variant-numeric: tabular-nums;   
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .ic { display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ic svg { width: 100%; height: 100%; display: block; }

  #toastLane {
    position: fixed; z-index: 400; left: 10px; right: 10px;
    top: calc(env(safe-area-inset-top) + 8px);
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  
  #doingLine { display: none; margin: 0 auto 7px; max-width: 720px;
    pointer-events: none; }
  #doingLine.on { display: flex; }
  #doingLine .pill { display: inline-flex; align-items: center; gap: 8px;
    max-width: 100%; padding: 7px 14px; border-radius: 999px;
    font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    backdrop-filter: blur(20px) saturate(1.7);
    box-shadow: 0 2px 14px rgba(0,0,0,.07), inset 0 0 0 1px rgba(255,255,255,.5); }
  
  #doingLine .w { font-weight: 600; color: var(--accent); overflow: hidden;
    text-overflow: ellipsis; }
  #doingLine .en { color: var(--accent); opacity: .55; font-size: 12px;
    font-weight: 600; flex: none; }
  #doingLine .t { flex: none; color: var(--dim); }
  #doingLine .t { opacity: .75; }

  .toast {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 14px 13px 16px; border-radius: 20px;
    pointer-events: auto; cursor: pointer;
    transform: translateY(-140%); opacity: 0;
    transition: transform .42s cubic-bezier(.22,1.1,.36,1), opacity .28s ease;
  }
  .toast.in { transform: translateY(0); opacity: 1; }
  .toast .ti { flex: none; width: 22px; height: 22px; color: var(--dim); }
  .toast .ti svg { width: 100%; height: 100%; stroke-width: 1.8; }
  .toast .tx { flex: 1; min-width: 0; }
  .toast .t1 { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .toast .t2 { font-size: 13px; color: var(--dim); line-height: 1.45; margin-top: 1px;
    word-break: break-word; }
  .toast .tx-close { flex: none; width: 26px; height: 26px; color: var(--dim); opacity: .7; }
  .toast .tx-close svg { width: 100%; height: 100%; stroke-width: 1.8; }

  .glass,
  .composer, #nkPop, .nk-say, .board-toggle, .menuCard, .crow, .songcard {
    
    background: var(--glass);
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--card) 76%, transparent),
      color-mix(in srgb, var(--card) 58%, transparent));
    -webkit-backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    backdrop-filter: blur(24px) saturate(1.9) brightness(1.04);
    border: 0;
    box-shadow:
      0 10px 34px rgba(0,0,0,.09),              /* 外阴影：浮起来 */
      0 1px 3px rgba(0,0,0,.05),                /* 贴地那道近影 */
      inset 0 1px 0 rgba(255,255,255,.92),      /* 顶部内高光：上边缘那道光 */
      inset 0 -7px 18px rgba(255,255,255,.34),  /* 底部内反光：光打在下沿的回弹 */
      inset 0 0 0 1px rgba(255,255,255,.44);    /* 一圈细描边：厚度的轮廓 */
  }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) .glass,
    html:not([data-theme="light"]) .songcard,
    html:not([data-theme="light"]) .composer,
    html:not([data-theme="light"]) #nkPop,
    html:not([data-theme="light"]) .nk-say,
    html:not([data-theme="light"]) .board-toggle,
    html:not([data-theme="light"]) .menuCard,
    html:not([data-theme="light"]) .crow {
      background: var(--glass);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--card) 74%, transparent),
        color-mix(in srgb, var(--card) 56%, transparent));
      box-shadow:
        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);
    }
}
html[data-theme="dark"] .glass,
  html[data-theme="dark"] .songcard,
  html[data-theme="dark"] .composer,
  html[data-theme="dark"] #nkPop,
  html[data-theme="dark"] .nk-say,
  html[data-theme="dark"] .board-toggle,
  html[data-theme="dark"] .menuCard,
  html[data-theme="dark"] .crow {
      background: var(--glass);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--card) 74%, transparent),
        color-mix(in srgb, var(--card) 56%, transparent));
      box-shadow:
        0 12px 38px rgba(0,0,0,.42),
        0 1px 3px rgba(0,0,0,.3),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 -7px 18px rgba(255,255,255,.045),
        inset 0 0 0 1px rgba(255,255,255,.09);
    }

  /* ============ 顶栏（悬浮玻璃，消息从底下滑过去） ============ */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    padding: 8px 12px 20px; padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 8px;
    
    background: linear-gradient(to bottom,
      color-mix(in srgb, var(--bg) 96%, transparent) 0%,
      color-mix(in srgb, var(--bg) 82%, transparent) 55%,
      transparent 100%);
    -webkit-backdrop-filter: blur(18px) saturate(1.6);
    backdrop-filter: blur(18px) saturate(1.6);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 52%, transparent 100%);
  }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex: none; color: var(--text);
  }
  .iconbtn .ic { width: 18px; height: 18px; }
  
  header .iconbtn.glass {
    background: transparent;
    border: none; box-shadow: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
  .title { flex: 1; text-align: center; min-width: 0; }
  .title h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .title .sub { font-size: 12px; color: var(--dim); line-height: 1.2; }

  /* ============ 消息流 ============ */
  
  #log {
    flex: 1; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    padding: calc(76px + env(safe-area-inset-top)) 18px 150px;
    display: flex; flex-direction: column; gap: 18px;
  }
  /* 顶上那颗「看更早的」——老账都在，按一下捞 400 行 */
  #olderBtn {
    align-self: center; border: none; cursor: pointer;
    background: rgba(128,128,128,.12); color: inherit; opacity: .72;
    font-size: 13px; padding: 6px 16px; border-radius: 14px;
  }
  .row { width: 100%; max-width: 720px; margin: 0 auto; }
  .row.me { display: flex; justify-content: flex-end; }
  .bubble {
    background: var(--user-bubble); border-radius: 18px; padding: 10px 16px;
    max-width: 85%; white-space: pre-wrap; word-break: break-word;
  }
  .gu { white-space: pre-wrap; word-break: break-word; }
  .gu img.chatimg, .bubble img.chatimg {
    max-width: min(240px, 70%); border-radius: 14px; display: block; margin: 6px 0;
  }
  
  .mdh { font-family: var(--serif); font-weight: 700; line-height: 1.4; margin: 10px 0 6px; }
  .mdh1 { font-size: 27px; }
  .mdh2 { font-size: 22px; }
  .mdh3 { font-size: 18.5px; }
  
  .gu strong, .bubble strong { font-weight: 700; }
  .gu s, .bubble s { opacity: .55; }
  .mdcode {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; padding: 1px 5px; border-radius: 5px;
    background: rgba(128,128,128,.15);
  }
  
  .cbk { margin: 10px 0; border-radius: 16px; overflow: hidden;
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .cbk-h { display: flex; align-items: center; gap: 2px;
    padding: 9px 10px 8px 15px; box-shadow: inset 0 -1px 0 var(--line); }
  .cbk-h .lang { flex: 1; min-width: 0; font-size: 12.5px; color: var(--dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cbk-h button { flex: none; width: 30px; height: 30px; padding: 6px;
    background: none; border: 0; color: var(--dim); cursor: pointer;
    border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .cbk-h button svg { width: 100%; height: 100%; stroke-width: 1.8; }
  .cbk-h button:active { background: rgba(128,128,128,.12); }
  
  .cbk-h button.done { color: var(--dim); }
  .cbk pre { margin: 0; padding: 13px 15px 15px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; }
  .cbk code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px; line-height: 1.7; white-space: pre;
    background: none; padding: 0; color: var(--text); }
  /* 点右边那个展开：整段代码摊到全屏看，长命令不用左右拖 */
  .cbk-full { position: fixed; inset: 0; z-index: 300; display: flex;
    flex-direction: column; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 12px); }
  .cbk-full .cbk-h { box-shadow: inset 0 -1px 0 var(--line); }
  .cbk-full pre { flex: 1; overflow: auto; }
  .cbk-full code { white-space: pre-wrap; word-break: break-all; }
  .gu .caret {
    display: inline-block; width: 7px; height: 1.05em; vertical-align: -2px;
    background: var(--accent-soft); border-radius: 1px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .toolline .ic { width: 15px; height: 15px; }
  .grabber {
    width: 38px; height: 5px; border-radius: 3px; background: var(--line);
    margin: 10px auto 0; flex: none;
  }
  .thinkbody {
    font-size: 15.5px; color: var(--text); line-height: 1.85;
    white-space: pre-wrap; word-break: break-word; padding: 6px 4px 14px;
  }

  .toolline {
    color: var(--dim); font-size: 14.5px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px; min-height: 24px;
    max-width: 100%;
  }
  .toolline:active { opacity: .6; }
  
  .toolline .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 1 1 auto; }
  .toolline .lbl b { font-weight: 500; color: var(--dim); }
  .toolline .plus { color: var(--green); }
  .toolline .minus { color: var(--red); }
  .toolline .chev { flex: none; font-size: 13px; }
  .toolline .spin {
    flex: none; width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent-soft);
    animation: rot 1s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  .sys { font-size: 13px; color: var(--dim); text-align: center; }
  .err {
    font-size: 13px; color: var(--red);
    border-left: 2px solid var(--red); padding-left: 12px; white-space: pre-wrap;
  }

  #pet {
    position: fixed; right: 8px; bottom: calc(118px + env(safe-area-inset-bottom));
    width: 96px; height: 96px; z-index: 30; cursor: grab; transition: opacity .25s, transform .25s;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #pet:active { cursor: grabbing; }
  body.sheet-open #pet, body.drawer-open #pet { opacity: 0; transform: scale(.8); pointer-events: none; }
  #pet img { width: 100%; height: 100%; display: block; pointer-events: none; }

  /* ============ 输入区 ============ */
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 6px 12px calc(10px + env(safe-area-inset-bottom));
    background: transparent; pointer-events: none;
  }
  /* padding-bottom 由 JS 跟着输入卡实际高度走，字永远不许被玻璃压住 */
  
  .composer {
    max-width: 720px; margin: 0 auto; pointer-events: auto;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(1.7);
    backdrop-filter: blur(20px) saturate(1.7);
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, .55);
    box-shadow: 0 2px 18px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.5);
    padding: 12px 14px 10px;
  }
  @media (prefers-color-scheme: dark) {
html:not([data-theme="light"]) #nkPop {
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 8px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    }
html:not([data-theme="light"]) #nkPop button {
      background: rgba(255,255,255,.1);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
html:not([data-theme="light"]) .nk-say {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 2px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
    }
html:not([data-theme="light"]) .composer {
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 2px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
    }
}
html[data-theme="dark"] .composer {
      background: var(--glass);
      border: 1px solid rgba(255, 255, 255, .12);
      box-shadow: 0 2px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
    }
  #attachStrip { display: none; gap: 8px; padding-bottom: 8px; flex-wrap: wrap; }
  #attachStrip .att {
    position: relative; width: 54px; height: 54px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--dim);
  }
  #attachStrip .att img { width: 100%; height: 100%; object-fit: cover; }
  #attachStrip .att .x {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #box {
    width: 100%; border: 0; outline: 0; resize: none; background: transparent;
    color: var(--text); font: inherit; line-height: 1.6;
    max-height: 160px; padding: 2px 2px 8px;
  }
  #box::placeholder { color: var(--dim); }
  .ctlrow { display: flex; align-items: center; gap: 8px; }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border-radius: 999px;
    padding: 7px 14px; font-size: 14px; color: var(--text);
  }
  .pill:active { opacity: .7; }
  .pill .ic { width: 14px; height: 14px; }
  #plusBtn { width: 36px; height: 36px; border-radius: 50%; background: var(--panel); flex: none; display: flex; align-items: center; justify-content: center; }
  #plusBtn .ic { width: 17px; height: 17px; }
  .ctlrow .gap { flex: 1; }
  #send {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  #send .ic { width: 17px; height: 17px; }
  #send:disabled { opacity: .35; }
  
  #send.stop { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  #send.stop .ic { display: none; }
  #send.stop::after {
    content: ''; width: 13px; height: 13px; border-radius: 3px; background: var(--text);
  }

  #lockWrap {
    position: fixed; inset: 0; z-index: 999; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 26px) 24px calc(env(safe-area-inset-bottom) + 15vh);
    transition: opacity .55s ease, transform .55s cubic-bezier(.4,0,.2,1);
    touch-action: none; user-select: none; -webkit-user-select: none;
    overflow: hidden;
  }
  
  #lockWrap.gone { opacity: 0; transform: translateY(-26px) scale(1.03); pointer-events: none; }
  .lk-time { font-size: 46px; font-weight: 300; letter-spacing: -.01em; color: var(--text);
    line-height: 1.05; font-variant-numeric: tabular-nums; }
  .lk-date { font-size: 14px; color: var(--dim); margin-top: 5px; letter-spacing: .06em; }
  .lk-art { width: min(52vw, 202px); height: auto; margin: 5vh 0 0;
    animation: lkFloat 6s ease-in-out infinite; }
  @keyframes lkFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
  
  .lk-word { font-family: var(--serif); font-size: 25px; color: var(--text);
    letter-spacing: .005em; margin: 34px 24px 38px; font-weight: 700;
    line-height: 1.42; text-align: center; }

  /* 液态玻璃滑块：半透明 + 背后模糊 + 一道内高光，压在浅底上才有"玻璃"的实感 */
  .lk-track {
    position: relative; width: min(84vw, 320px); height: 62px; border-radius: 999px;
    background: var(--panel);
    box-shadow: inset 0 0 0 1px var(--line);
    overflow: hidden;
  }
  /* 一道慢慢扫过去的光，暗示"往右滑" */

  /* ============ 弹层 ============ */

  /* 全屏房间开着时，聊天的顶栏和输入卡先退场——毛玻璃层在个别浏览器里会钻上来 */

  /* 搜索 */

  .cal-head { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 2px 0 14px; }
  .cal-head .cm { font-size: 18px; font-weight: 600; min-width: 145px; text-align: center; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  .cal-head .cnav { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: .55; }
  .cal-head .cnav .ic { width: 14px; height: 14px; }
  .cal-head .ctoday {   
    position: absolute; right: 0; top: 4px;
    font-size: 12.5px; color: var(--dim); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  
  .cal-week {
    display: grid; grid-template-columns: repeat(7, 1fr);

  }

  .cal-day.sel .dnum { background: color-mix(in srgb, var(--dim) 30%, transparent); }
  
  .cal-day.today .dnum { background: var(--accent); color: #fff; }  /* 今天=这一屏唯一的一粒橘 */
  .cal-day .dnum, .cal-day .dots { position: relative; z-index: 1; }

  .cal-day .dots .ds { background: var(--text); }
  /* 详情区：日期是节标，每件事是一根圆角玻璃条 */
  .cal-detail { margin-top: 20px; }

    .pcard .pt { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; padding-bottom: 6px; }
  .pcard .pt .ic { width: 14px; height: 14px; color: var(--pink); }
  /* 一行一件事，左边名目右边内容——跟小票的表头一个排法 */

  .pv .lv svg { fill: currentColor; stroke: none; }
  .pv .gap { gap: 11px; display: flex; align-items: center; }

  .pv .face { width: 25px; height: 25px; color: var(--dim); opacity: .45; }

  .pv .face svg { stroke-width: 1.7; }
  /* 来没来：iOS 那种开关 */
  .psw {
    width: 46px; height: 27px; border-radius: 999px; flex: none;

    position: relative; transition: background .22s;

  .psw::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px;

  .plock { font-size: 11.5px; color: var(--dim); margin-top: 8px; }

  /* 身体间(8/3 完整版,鼠尾草的岗):sage 总览卡 + 分组卡 + 大数值行 */
  
  /* 比原版再放开一点：让花撑出卡片的内边距（svg overflow 是 visible，标签不会被切）。
     算过：最外那个标签离中心 140/310，撑到 412px 宽时是 186px，
     屏幕中线 215 → 最远 401，离屏幕边还有 29px 余量 */
  
  .drive-flower { touch-action: manipulation; width: 100%; display: block; overflow: visible; }
  @keyframes petal-sway { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg); } }
  
  .sw { width: 46px; height: 28px; border-radius: 999px; background: var(--line);
    flex: none; position: relative; transition: background .28s; margin-left: auto; }
  .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 999px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18);
    transition: transform .28s cubic-bezier(.34,1.4,.5,1); }
  .sw.on { background: var(--sage); }
  .sw.on::after { transform: translateX(18px); }
  .sw.wait { opacity: .45; }
  .grow .val + .sw { margin-left: 10px; }

  /* --tone 挂在整页上，不能挂在 SVG 里那个 g 上——挂在 g 上，
     底下的按钮在 SVG 外面，继承不到，选中的按钮就成了没底色的光杆 */
  
  @keyframes bdFloat  { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-11px); } }
  @keyframes bdBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  
  @media (prefers-color-scheme: dark) {

  .note {
    position: absolute; width: 46%; max-width: 220px;
    border-radius: 6px; padding: 18px 13px 12px;

    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;

  .note { --tape: rgba(240, 232, 212, .9); }
  .note::before {
    content: ""; position: absolute; border-radius: 2px;
    background: var(--tape); box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .note.t-h::before {   /* 横贴顶中 */
    top: -7px; left: 50%; margin-left: -24px; width: 48px; height: 15px;
    transform: rotate(var(--ta, -2deg));
  }
  .note.t-l::before {   /* 歪贴左上角 */
    top: -8px; left: -12px; width: 44px; height: 14px; transform: rotate(-38deg);
  }
  .note.t-r::before {   /* 歪贴右上角 */
    top: -8px; right: -12px; width: 44px; height: 14px; transform: rotate(38deg);
  }
  .note.t-v::before {   
    top: -12px; left: 50%; margin-left: -7px; width: 14px; height: 30px;
    transform: rotate(var(--ta, 2deg));
  }
  .note.t-2::before {   /* 对角两条 */
    top: -8px; right: -12px; width: 44px; height: 14px; transform: rotate(38deg);
  }
  .note.t-2::after {
    content: ""; position: absolute; bottom: -7px; left: -13px;
    width: 44px; height: 14px; border-radius: 2px;
    background: var(--tape); box-shadow: 0 1px 3px rgba(0,0,0,.12);
    transform: rotate(38deg);
  }

}

  /* ============ 今天（管家首页） ============ */

  .pdot { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); flex: none; }

  .pdot.off { background: var(--dim); opacity: .5; }
  @keyframes pdotPulse { 50% { opacity: .3; transform: scale(.75); } }

  .td-letter { display: block; width: 100%; text-align: left; position: relative; overflow: hidden;
    background: var(--accent); color: #fff; border-radius: 22px; padding: 18px 20px 15px; margin-top: 4px; }
  .td-letter::after { content: '\201C'; position: absolute; right: 14px; top: -22px;
    font-family: Georgia, serif; font-size: 130px; line-height: 1; opacity: .16; }
  .td-letter .eb { font-size: 11.5px; letter-spacing: .14em; opacity: .78; }

    position: relative; z-index: 1; }

  .td-mood { background: var(--panel); border-radius: 20px; padding: 15px 16px 14px; margin-top: 12px; }

    color: var(--dim); font-size: 11.5px; transition: transform .18s ease; }
  .td-mood .face .ic { opacity: .5; }

  .td-mood .face.on { color: var(--pink); }

  .td-mood .face.on span:last-child { color: var(--text); font-weight: 600; }
  .td-mood .say { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--line); font-size: 14px; line-height: 1.55; animation: rise .3s ease; }
  .td-mood .say .tx { flex: 1; font-family: var(--serif); }
  .td-mood .say .go { flex: none; background: var(--text); color: var(--bg); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; }

  .td-line { position: relative; padding-left: 4px; }
  .td-ev { display: flex; align-items: center; gap: 10px; padding: 10px 4px; position: relative; }
  .td-ev + .td-ev, .td-now + .td-ev { border-top: 1px dashed var(--line); }
  .td-ev .tm { width: 44px; flex: none; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--text); }
  .td-ev .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); }
  .td-ev.todo .dot { background: transparent; box-shadow: inset 0 0 0 1.6px var(--amber); }
  .td-ev.special .dot { background: var(--pink); }
  .td-ev .tx { flex: 1; min-width: 0; font-size: 15px; line-height: 1.45; }
  .td-ev .tx small { display: block; font-size: 12px; color: var(--dim); }
  .td-ev .tx small.soon { color: var(--accent); font-weight: 600; }
  .td-ev.past .tm, .td-ev.past .tx { color: var(--dim); }
  .td-ev.past .dot { opacity: .45; }
  .td-ev.done .tx { color: var(--dim); }
  .td-ev.done .tx .t, .td-ev.done .tm { text-decoration: line-through; }
  .td-ev .ck { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--panel);
    display: flex; align-items: center; justify-content: center; color: var(--dim); }

  .td-now { display: flex; align-items: center; gap: 8px; padding: 4px 0; color: var(--accent);
    font-size: 11.5px; font-weight: 600; letter-spacing: .06em; }
  .td-now i { flex: 1; height: 1.5px; background: var(--accent); opacity: .5; order: 2; border-radius: 2px; }
  .td-empty { color: var(--dim); font-size: 14px; padding: 14px 4px; }
  .td-more { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    margin-top: 8px; padding: 12px 15px; border-radius: 15px; background: var(--panel); font-size: 13.5px; }
  .td-more .tx { flex: 1; min-width: 0; color: var(--dim); line-height: 1.5;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .td-more .val { flex: none; font-size: 13px; color: var(--text); font-weight: 600; }

  .td-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    display: flex; flex-direction: column; transition: transform .15s ease; }

  .td-tile .v small { font-family: inherit; font-size: 13px; color: var(--dim); }

  .td-tile .hl { font-family: var(--serif); font-size: 16.5px; line-height: 1.5; margin-top: 5px; }

  .td-asks { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }

    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; }
  .td-asks .chip .ic { color: var(--accent); }

  /* ============ 接入 API ============ */
  .ap-seg { display: flex; gap: 4px; padding: 4px; background: var(--panel); border-radius: 14px; margin-top: 4px; }
  .ap-seg button { flex: 1; padding: 9px 0; border-radius: 11px; font-size: 14px; color: var(--dim); }
  .ap-seg button.on { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .ap-hint { font-size: 12.5px; color: var(--dim); padding: 8px 4px 2px; line-height: 1.6; }
  .ap-card { background: var(--panel); border-radius: 18px; padding: 6px 16px; margin-top: 12px; }
  .ap-f { display: block; padding: 12px 0; }
  .ap-f + .ap-f, .ap-adv { border-top: 1px solid var(--line); }
  .ap-f .lb { display: block; font-size: 12.5px; color: var(--dim); letter-spacing: .06em; margin-bottom: 6px; }

  .ap-tok { display: flex; gap: 8px; }

  .ap-tok .eye { flex: none; padding: 0 12px; border-radius: 12px; font-size: 13px; color: var(--dim);
    background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .ap-foot { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .ap-foot:empty { display: none; }
  .ap-foot.warn { color: var(--amber); }
  .ap-foot.bad { color: var(--red); }
  .ap-adv { padding: 4px 0; }
  .ap-adv summary { cursor: pointer; font-size: 13.5px; color: var(--dim); padding: 10px 0; list-style: none; }
  .ap-adv summary::-webkit-details-marker { display: none; }

  .ap-adv[open] summary::after { content: ' ‹'; }
  .ap-btns { display: flex; gap: 10px; margin-top: 16px; }
  .ap-b { flex: 1; padding: 13px 0; border-radius: 999px; font-size: 15px; font-weight: 600;
    background: var(--panel); color: var(--text); }

  .ap-msg { display: none; white-space: pre-wrap; word-break: break-all; font-size: 13.5px; line-height: 1.65;

  .ap-msg.on { display: block; animation: rise .22s ease; }

  .ap-msg.bad { background: var(--red-track); }
  .ap-back { display: block; margin: 14px auto 0; font-size: 13.5px; color: var(--red); padding: 8px 14px; }
  .ap-note { font-size: 12.5px; color: var(--dim); line-height: 1.85; margin-top: 18px; padding: 0 4px; }

  .tstamp { align-self: center; font-size: 12px; color: var(--dim); opacity: .8; margin: 4px 0 -6px;
    font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .hello { margin: auto 0; padding: 0 6px 14vh; text-align: center; animation: rise .5s ease; }
  .hello .hl1 { font-family: var(--serif); font-size: 26px; line-height: 1.4; }
  .hello .hl2 { font-size: 13px; color: var(--dim); margin-top: 8px; letter-spacing: .04em; }

  /* ============ 动态 / 心愿 / 专注 ============ */
  .td-wx { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 10px; }
  .td-wx .tn { font-family: var(--serif); font-size: 22px; line-height: 1; }
  .td-wx .tt { font-size: 13px; color: var(--dim); }

  .mo-write { display: flex; align-items: flex-end; gap: 8px; background: var(--panel); border-radius: 18px;

  .mo-tm { margin-left: auto; font-size: 12px; color: var(--dim); }

  .mo-likes { display: flex; align-items: center; gap: 5px; color: var(--pink); }
  .mo-likes + .mo-c { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; }
  .mo-c b { font-weight: 600; }
  .mo-reply { display: none; gap: 8px; margin: 8px 0 0 41px; }
  .mo-reply.on { display: flex; }
  .mo-reply input { flex: 1; min-width: 0; border: 0; outline: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 14px;
    padding: 8px 12px; border-radius: 999px; }
  .mo-reply button { flex: none; font-size: 14px; color: var(--accent); font-weight: 600; padding: 0 6px; }

  .cp-list { display: grid; gap: 10px; }

    --cut: var(--bg); }

  .cp::before { top: -8px; } .cp::after { bottom: -8px; }
  .cp-l { flex: 1; min-width: 0; padding: 14px 16px; }
  .cp-t { font-family: var(--serif); font-size: 17px; line-height: 1.4; }

  .cp-add { margin-top: 16px; }

  .fc-dial { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 10px auto 6px; }
  .fc-dial svg { width: 100%; height: 100%; display: block; }

  .fc-dial .fl { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .fc-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .fc-t { font-family: var(--serif); font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
  .fc-s { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .fc-chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
  .fc-chips .chip { padding: 8px 14px; border-radius: 999px; background: var(--panel); font-size: 14px; color: var(--dim); }
  .fc-chips .chip.on { background: var(--text); color: var(--bg); }
  .fc-task { font-family: inherit; text-align: center; }
  .fc-go { display: block; width: 100%; margin-top: 14px; }
  .fc-say { text-align: center; font-family: var(--serif); font-size: 17px; margin: 14px 0 6px; }

  /* ============ 页内弹窗 / 接入 第二版 ============ */
  .ask-sheet { min-height: 0; padding-bottom: 6px; }
  .ask-sheet .body { padding-top: 22px; }
  .ask-t { font-size: 18px; font-weight: 700; text-align: center; }

  .ask-in { margin-top: 16px; font-family: inherit; }

  .ap-b.go.danger { background: var(--red); color: #fff; }
  .ap-seg.four button { font-size: 13px; padding: 9px 0; }
  .ap-cli .ap-clist { font-size: 13px; line-height: 1.6; padding: 10px 12px; border-radius: 12px; background: var(--card); word-break: break-all; }
  .ap-clist.ok { color: var(--green); }
  .ap-clist.bad { color: var(--red); }

  .ap-empty { font-size: 13px; color: var(--dim); text-align: center; padding: 14px 0; }

  /* ═══ 第四轮：记忆 / 信箱 / 工作间 / 后台 ═══ */

  .mem-stone { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 999px;
    padding: 5px 5px 5px 15px; position: relative; overflow: visible; }

    display: grid; place-items: center; }

    border-radius: 50%; border: 2px solid var(--accent-soft); animation: stone 0.9s ease-out forwards; pointer-events: none; }
  @keyframes stone { from { transform: scale(.3); opacity: .9; } to { transform: scale(9); opacity: 0; } }
  .rip-wrap { overflow-x: auto; margin: 14px -4px 0; padding: 0 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

  .rip-svg { display: block; }

  .rip-day.on .rip-lbl { fill: var(--text); font-weight: 700; }
  .rip-lbl { font-size: 10px; fill: var(--dim); font-variant-numeric: tabular-nums; }

const HOME = {
  me: '欣欣',            // 他怎么叫你
  him: '顾屿',           // 他叫什么

/* 接了后端就以设置里的为准（设置 → 名字和地点） */
function loadHomeConf() {
  return fetch('api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(c => {
    if (!c || !c.ok) return;
    HOME.me = c.me || HOME.me; HOME.him = c.him || HOME.him; HOME.since = c.since || HOME.since;
    TZM = (c.tz != null && c.tz !== '') ? Math.round(Number(c.tz) * 60) : -new Date().getTimezoneOffset();
    const rg = document.getElementById('recGu'); if (rg) rg.textContent = HOME.him;
  }).catch(() => {});
}
loadHomeConf();

/* ---------- 小螃蟹 ---------- */
const petImg = document.getElementById('petImg');
/* 小螃蟹的图没放进仓库（pet/ 目录要自己补）。图不在就整只藏起来，别挂一个裂图在角上 */
petImg.addEventListener('error', () => { document.getElementById('pet').style.display = 'none'; });
const PET = {
  idle: 'idle.svg', thinking: 'thinking.svg', typing: 'typing.svg', happy: 'happy.svg', doze: 'doze.svg', sleeping: 'sleeping.svg',
  shy: 'shy.svg', surprised: 'surprised.svg', calm: 'idle.svg', react: 'happy.svg',
};
let petState = 'idle';
let petTimer = null;
let lastEventAt = Date.now();
function petSet(state, holdMs) {
  if (petState === state && !holdMs) return;
  petState = state;
  if (typeof presence === 'function') presence(state);
  petImg.src = 'pet/' + (PET[state] || PET.idle);
  if (petTimer) { clearTimeout(petTimer); petTimer = null; }
  if (holdMs) petTimer = setTimeout(() => petSet('idle'), holdMs);
}
/* 家里没动静：5 分钟打盹，15 分钟睡熟；有动静立刻醒 */
setInterval(() => {
  if (petState === 'thinking' || petState === 'typing') return;
  const quiet = Date.now() - lastEventAt;
  if (quiet > 15 * 60e3) petSet('sleeping');
  else if (quiet > 5 * 60e3) petSet('doze');
}, 30e3);
/* 拽着满屏跑：拖到哪儿住哪儿（记在 localStorage），轻点一下他跳给你看 */
const petEl = document.getElementById('pet');
(function restorePetPos() {
  try {
    const p = JSON.parse(localStorage.getItem('petPos'));
    if (!p) return;
    const l = Math.min(Math.max(4, p.l), innerWidth - 108);
    const t = Math.min(Math.max(4, p.t), innerHeight - 108);
    petEl.style.left = l + 'px'; petEl.style.top = t + 'px';
    petEl.style.right = 'auto'; petEl.style.bottom = 'auto';
  } catch {}
})();
let pDrag = null;
petEl.addEventListener('pointerdown', (e) => {
  const r = petEl.getBoundingClientRect();
  pDrag = { x: e.clientX, y: e.clientY, left: r.left, top: r.top, w: r.width, h: r.height, moved: false };
  petEl.setPointerCapture(e.pointerId);
});
petEl.addEventListener('pointermove', (e) => {
  if (!pDrag) return;
  const dx = e.clientX - pDrag.x, dy = e.clientY - pDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 6) pDrag.moved = true;
  if (!pDrag.moved) return;
  const l = Math.min(Math.max(4, pDrag.left + dx), innerWidth - pDrag.w - 4);
  const t = Math.min(Math.max(4, pDrag.top + dy), innerHeight - pDrag.h - 4);
  petEl.style.left = l + 'px'; petEl.style.top = t + 'px';
  petEl.style.right = 'auto'; petEl.style.bottom = 'auto';
});
petEl.addEventListener('pointerup', () => {
  if (!pDrag) return;
  if (pDrag.moved) {
    const r = petEl.getBoundingClientRect();
    localStorage.setItem('petPos', JSON.stringify({ l: r.left, t: r.top }));
  } else {
    petSet('react', 1800);   // 戳他一下，他跳给你看
  }
  pDrag = null;
});

let guEl = null;

/* ---------- 基础排版 ---------- */
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 90; }
function scroll(force) { if (force || atBottom()) log.scrollTop = log.scrollHeight; }
function row(cls) {
  const d = document.createElement('div');
  d.className = 'row ' + (cls || '');
  log.appendChild(d);
  return d;
}
/* 聊天里的时间：隔了半小时以上才插一行小字，平时不打扰（跟微信一个分寸） */
let lastStampAt = 0;
function stampIf(at) {
  if (!at) return;
  if (lastStampAt && at - lastStampAt < 1800) { lastStampAt = at; return; }
  lastStampAt = at;
  const off = (TZM + new Date().getTimezoneOffset()) * 60000;
  const d = new Date(at * 1000 + off), now = new Date(Date.now() + off);
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const dayDiff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400e3);
  const t = document.createElement('div');
  t.className = 'tstamp';
  t.textContent = dayDiff === 0 ? hm : dayDiff === 1 ? '昨天 ' + hm
    : dayDiff < 7 ? '周' + '日一二三四五六'[d.getDay()] + ' ' + hm
    : (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hm;
  log.appendChild(t);
}
function addMe(text) {
  const r = row('me');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  r.appendChild(b);
  renderRich(b);
  scroll(true);
  guEl = null; endThink(); closeGroup();
}

const thinkStore = [];
let turnThink = null;      // 本轮唯一的那一段
let curThinkIdx = -1;      // 弹层里正看着哪段
const thinkBodyEl = document.getElementById('thinkBodyEl');

function thinkSpin(buf, on) {
  const line = buf.lineEl;
  const old = line.querySelector('.spin, .ic');
  if (!old) return;
  if (on) {
    const sp = document.createElement('span');
    sp.className = 'spin';
    old.replaceWith(sp);
  } else {
    old.replaceWith(icEl('clock', 15));
  }
}
function ensureThink() {
  if (turnThink) {
    if (turnThink.paused) {          // 歇过又想了：回同一段，接着写
      turnThink.text += '\n\n';
      turnThink.paused = false;
      thinkSpin(turnThink, true);
    }
    return turnThink;
  }
  closeGroup();
  const r = row();
  const line = document.createElement('button');
  line.className = 'toolline';
  line.innerHTML = '<span class="spin"></span><span class="lbl">Thought process</span><span class="chev">›</span>';
  r.appendChild(line);
  const buf = { text: '', lineEl: line, paused: false };
  thinkStore.push(buf);
  const idx = thinkStore.length - 1;
  line.onclick = () => openThinkSheet(idx);
  turnThink = buf;
  guEl = null;
  scroll();
  return turnThink;
}
function appendThink(t) {
  const buf = ensureThink();
  buf.text += t;
  if (curThinkIdx === thinkStore.indexOf(buf) && sheets.think.classList.contains('open')) {
    thinkBodyEl.textContent = buf.text;
  }
}
function closeThink() {                // 歇一下：图标睡成时钟，但这段还认账
  if (turnThink && !turnThink.paused) {
    turnThink.paused = true;
    thinkSpin(turnThink, false);
  }
}
function endThink() {                  // 这一轮说完了，真正合上
  closeThink();
  turnThink = null;
}
function openThinkSheet(idx) {
  curThinkIdx = idx;
  thinkBodyEl.textContent = thinkStore[idx].text;
  sheets.think.classList.add('open');
}
function ensureGu() {
  if (guEl) return guEl;
  closeThink(); closeGroup();
  const r = row();
  const d = document.createElement('div');
  d.className = 'gu';
  r.appendChild(d);
  guEl = d;
  scroll();
  return guEl;
}
function note(text, cls, sticky) {
  const [t1, t2] = toastSplit(text);
  const el = toast(t1, t2, cls === 'err' ? 'zap' : 'check', sticky);
  const line = el._t2;
  /* 老调用点写的是 tip.textContent = '（…）'，还是整句带括号——
     所以这行字自己会拆：括号去掉，逗号前的补回标题去 */
  return {
    set textContent(v) {
      const [a, b] = toastSplit(v);
      const h = el.querySelector('.t1');
      if (h) h.textContent = a;
      line.textContent = b;
      line.style.display = b ? '' : 'none';
    },
    get textContent() { return line.textContent; },
    close() { el._away && el._away(); },
  };
}

/* 提示条（2026-08-07）。用法：toast('他有反应了', '刚才那一下，他记住了')
   第三个参数是图标名（家里 ICONS 里的），不给就用一个默认的。
   自动收走，也可以点掉。同时最多挂三条，多了顶掉最老的—— */
let toastLane = null;
function toast(title, body, icon, sticky) {
  if (!toastLane) {
    toastLane = document.createElement('div');
    toastLane.id = 'toastLane';
    document.body.appendChild(toastLane);
  }
  const el = document.createElement('div');
  el.className = 'toast glass';
  const ic = document.createElement('span');
  ic.className = 'ti';
  ic.innerHTML = ICONS[icon] || ICONS.bell || '';
  const tx = document.createElement('div');
  tx.className = 'tx';
  const t1 = document.createElement('div');
  t1.className = 't1'; t1.textContent = title;
  tx.appendChild(t1);
  const t2 = document.createElement('div');
  t2.className = 't2'; t2.textContent = body || '';
  if (!body) t2.style.display = 'none';
  tx.appendChild(t2);
  el._t2 = t2;
  const x = document.createElement('span');
  x.className = 'tx-close'; x.innerHTML = ICONS.x || '';
  el.append(ic, tx, x);
  toastLane.appendChild(el);
  while (toastLane.children.length > 3) toastLane.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  const away = () => {
    el.classList.remove('in');
    setTimeout(() => el.remove(), 460);
  };
  el._away = away;
  /* sticky：搬大文件那种要一直改进度的，不能 4 秒就自己走 */
  if (sticky) {
    el.onclick = away;
  } else {
    const t = setTimeout(away, 4200);
    el.onclick = () => { clearTimeout(t); away(); };
  }
  return el;
}

function toastSplit(text) {
  const t = String(text == null ? '' : text)
    .replace(/^[（(]/, '').replace(/[）)]$/, '').trim();
  const i = t.indexOf('，');
  return i > 0 ? [t.slice(0, i), t.slice(i + 1)] : [t, ''];
}

/* 说话里夹的料——图（表情包、照片链接）变成真的图，行首 # 变成大字 */
const IMG_RE = /!\[[^\]]*\]\(((?:https?:\/\/|api\/img\?|data:image\/)[^\s)]+)\)|(https?:\/\/[^\s"'<>]+?\.(?:png|jpe?g|gif|webp)(?:\?[^\s"'<>]*)?)/gi;
const H_RE = /^(#{1,3})\s+(.*)$/;
/* 行内的重音：**粗** `码` ~~划掉~~。全用 createElement 拼，不碰 innerHTML */
const INLINE_RE = /\*\*([^\n]+?)\*\*|`([^`\n]+?)`|~~([^\n]+?)~~/g;
function appendInline(el, text, streaming) {
  let tail = null;
  if (streaming) {
    const marks = [['**', 'strong'], ['`', 'code'], ['~~', 's']];
    for (const [mk, tag] of marks) {
      const n = text.split(mk).length - 1;
      if (n % 2) {
        const i = text.lastIndexOf(mk);
        tail = { text: text.slice(i + mk.length), tag };
        text = text.slice(0, i);
        break;
      }
    }
    const cutLone = (s) => (s.endsWith('*') && !s.endsWith('**') ? s.slice(0, -1) : s);
    if (tail) tail.text = cutLone(tail.text);
    else text = cutLone(text);
  }
  INLINE_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = INLINE_RE.exec(text))) {
    if (m.index > last) el.append(text.slice(last, m.index));
    let node;
    if (m[1] !== undefined) { node = document.createElement('strong'); node.textContent = m[1]; }
    else if (m[2] !== undefined) { node = document.createElement('code'); node.className = 'mdcode'; node.textContent = m[2]; }
    else { node = document.createElement('s'); node.textContent = m[3]; }
    el.appendChild(node);
    last = m.index + m[0].length;
  }
  if (last < text.length) el.append(text.slice(last));
  if (tail && tail.text) {
    const node = document.createElement(tail.tag);
    if (tail.tag === 'code') node.className = 'mdcode';
    node.textContent = tail.text;
    el.appendChild(node);
  }
}

const ORPHAN_TAIL = /(?:\n\n\S)+$/;

function trimOrphanTail(el) {
  const raw = el._raw != null ? el._raw : el.textContent;
  el._final = true;               // 这一轮完了，这条消息定稿，谁都别再画它
  const m = raw && raw.match(ORPHAN_TAIL);
  if (!m) return;
  el._raw = raw.slice(0, raw.length - m[0].length);
  el.textContent = el._raw;
  el.removeAttribute('data-rich');
  renderRich(el);
}

const STREAM_FILE_TAIL = /(?:https?:\/\/[^\s"'<>]*)?\/?a(?:p(?:i(?:\/(?:f(?:i(?:l(?:e(?:\?(?:n(?:a(?:m(?:e(?:=[^\s"'<>]*)?)?)?)?)?)?)?)?)?)?)?)?)?$/;

/* 说到一半的歌链接：这条比文件那条更要紧。
   `…song?id=1146` 写到这儿，正则里的 \d+ 已经能匹配了——它会当场
   渲染出一张**指错歌**的卡片，然后跳成另一首。所以流式的时候
   结尾那个还没写完的链接一律藏住，定稿再变卡片。 */
const STREAM_SONG_TAIL = /https?:\/\/(?:[a-z0-9.]*music[a-z0-9.]*|[a-z]{1,6})(?:\/[^\s]*)?$/i;

/* 流式重绘：攒着原文，每帧重画一次（rAF 合并，别一个 token 排一次版） */
function paintStream(el) {
  if (el._final || el._painting) return;
  el._painting = true;
  requestAnimationFrame(() => {
    el._painting = false;
    // 定稿的那份是权威。刷新网页时几百条事件在一个循环里跑完，rAF 排在最后面才轮到——
    // 不拦这一下，它会把已经画好的卡片、加粗、摘干净的孤尾全冲回流式那版。
    if (el._final || !el.isConnected) return;
    el.textContent = '';
    // 流式时也压着孤尾：真有下文的话，下一帧就补齐了，只差一帧；
    const t = (el._raw || '').replace(ORPHAN_TAIL, '')
      .replace(STREAM_FILE_TAIL, '').replace(STREAM_SONG_TAIL, '');
    appendWithImages(el, t, true);
    const c = document.createElement('span');
    c.className = 'caret';
    el.appendChild(c);
  });
}

const SONG_RE = /https?:\/\/music\.163\.com\/(?:#\/)?song\?id=(\d+)|\[song:(\d*)\|([^\]|]*)\|([^\]]*)\]/g;

function openSong(id) {

function appendSongCard(el, id) {

/* 他点的歌：[song:网易云id|歌名|歌手]。有 id 就能在家里放；没有就点开去网易云搜 */

const FILE_RE = /(?:https?:\/\/[^\s"'<>]*)?\/?api\/file\?name=([^\s"'<>&`*，。！？；：、（）【】「」『』]+)/g;
// 英文标点贴在名字屁股上时摘掉；句点不摘，那是扩展名
const NAME_TAIL = /[,!?;:)\]}]+$/;

function fileName(raw) {
  const name = String(raw || '').replace(NAME_TAIL, '');
  let show = name;
  try { show = decodeURIComponent(name); } catch (e) {}
  return { name, show };
}

function appendFileCard(el, raw) {
  const { name, show } = fileName(raw);
  const a = document.createElement('a');
  a.className = 'filecard';
  a.href = 'api/file?name=' + encodeURIComponent(show);
  a.download = show;
  a.appendChild(icEl('filePlus', 17));
  const s = document.createElement('span');
  s.textContent = show;
  a.appendChild(s);
  // 改成自己把文件抓回来做成 blob 再存——页面一动不动，聊天还在原地
  a.addEventListener('click', async (e) => {
    e.preventDefault();
    if (a._busy) return;
    a._busy = true;
    const old = s.textContent;
    s.textContent = old + ' · 拿着…';
    try {
      const r = await fetch(a.href, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status === 404 ? '柜子里没这个文件' : '拿不到（' + r.status + '）');
      const url = URL.createObjectURL(await r.blob());
      const t = document.createElement('a');
      t.href = url; t.download = show;
      document.body.appendChild(t); t.click(); t.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      s.textContent = old;
    } catch (err) {
      s.textContent = old + ' · ' + (err.message || '出岔子了');
      setTimeout(() => { s.textContent = old; }, 4000);
    }
    a._busy = false;
  });
  el.appendChild(a);
}

function appendWithImages(el, text, streaming) {
  SONG_RE.lastIndex = 0;
  if (SONG_RE.test(text)) {
    const re = new RegExp(SONG_RE.source, 'g');
    let cur = 0, sm;
    while ((sm = re.exec(text))) {
      if (sm.index > cur) appendWithImages(el, text.slice(cur, sm.index), streaming);
      if (sm[1]) appendSongCard(el, sm[1]); else appendNamedSong(el, sm[2], sm[3], sm[4]);
      cur = sm.index + sm[0].length;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  // 再把文件链接摘出来做成卡片，剩下的照旧走图片和行内标记
  FILE_RE.lastIndex = 0;
  if (FILE_RE.test(text)) {
    // 自己的正则实例：下面要递归，共用全局 lastIndex 会被里层重置成 0，外层就永远绕不出去
    const re = new RegExp(FILE_RE.source, 'g');
    let cur = 0, fm;
    while ((fm = re.exec(text))) {
      if (fm.index > cur) appendWithImages(el, text.slice(cur, fm.index), streaming);
      appendFileCard(el, fm[1]);
      const eaten = fm[1].length - fm[1].replace(NAME_TAIL, '').length;
      cur = fm.index + fm[0].length - eaten;
    }
    if (cur < text.length) appendWithImages(el, text.slice(cur), streaming);
    return;
  }
  IMG_RE.lastIndex = 0;
  let last = 0, m;
  while ((m = IMG_RE.exec(text))) {
    if (m.index > last) appendInline(el, text.slice(last, m.index), streaming);
    const img = document.createElement('img');
    img.src = m[1] || m[2];
    img.className = 'chatimg';
    img.loading = 'lazy';
    img.onload = () => scroll();
    el.appendChild(img);
    last = m.index + m[0].length;
  }
  if (last < text.length) appendInline(el, text.slice(last), streaming);
}
const FENCE_RE = /```([^\n`]*)\n([\s\S]*?)```/g;

function appendCodeBlock(el, lang, code) {
  el.appendChild(buildCodeBlock(lang, code));
}

function buildCodeBlock(lang, code, isFull) {
  const box = document.createElement('div');
  box.className = isFull ? 'cbk cbk-full' : 'cbk';
  const head = document.createElement('div');
  head.className = 'cbk-h';
  const nm = document.createElement('span');
  nm.className = 'lang';
  nm.textContent = (lang || '').trim() || 'Code';

  const cp = document.createElement('button');
  cp.innerHTML = ICONS.copy;
  cp.title = '复制';
  cp.onclick = () => {
    const ok = () => {
      cp.innerHTML = ICONS.check; cp.classList.add('done');
      setTimeout(() => { cp.innerHTML = ICONS.copy; cp.classList.remove('done'); }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(ok).catch(() => {});
    else {
      const t = document.createElement('textarea');
      t.value = code; t.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(t);
    }
  };

  const ex = document.createElement('button');
  ex.innerHTML = isFull ? ICONS.x : ICONS.expand;
  ex.title = isFull ? '收起' : '展开';
  ex.onclick = () => {
    if (isFull) { box.remove(); return; }
    const full = buildCodeBlock(lang, code, true);
    document.body.appendChild(full);
  };

  head.append(nm, cp, ex);
  const pre = document.createElement('pre');
  const cd = document.createElement('code');
  cd.textContent = code.replace(/\n$/, '');
  pre.appendChild(cd);
  box.append(head, pre);
  return box;
}

function renderRich(el) {
  if (!el || el.dataset.rich) return;
  // 流式那条路把标记边走边吃掉了，textContent 里已经没有原文——认 _raw
  const text = el._raw != null ? el._raw : el.textContent;
  FENCE_RE.lastIndex = 0;
  if (FENCE_RE.test(text)) {
    /* 有代码块：切成「文本 / 代码块 / 文本 …」，文本那几段还走原来那条路 */
    el.textContent = '';
    FENCE_RE.lastIndex = 0;
    let last = 0, m;
    while ((m = FENCE_RE.exec(text))) {
      if (m.index > last) renderPlainInto(el, text.slice(last, m.index));
      appendCodeBlock(el, m[1], m[2]);
      last = m.index + m[0].length;
    }
    if (last < text.length) renderPlainInto(el, text.slice(last));
    if (!el.innerHTML && text) el.textContent = text;   // 同一条兜底：宁可少一次排版
    el.dataset.rich = '1';
    return;
  }
  renderPlainInto(el, text, true);
  el.dataset.rich = '1';
}

/* 原来 renderRich 的身子拆出来单用——代码块之间的那些文本还要走它。
   有一处坑：这个身子第一句是 `el.textContent = ''`（原来它独占整个气泡，
   清空是对的）。拆出来之后一条消息里会调它好几次，第二次一清空
   就把前面already渲染好的代码块连同文本一起抹了——实测出来的现象是
   气泡里只剩最后一段。所以非独占的时候让它渲染到一个临时 span 里，
   渲染完再挂上去，函数体一个字都不用改。 */
function renderPlainInto(host, text, whole) {
  const el = whole ? host : document.createElement('span');
  IMG_RE.lastIndex = 0;
  const hasImg = IMG_RE.test(text);
  const hasH = /^#{1,3}\s+/m.test(text);
  INLINE_RE.lastIndex = 0;
  const hasInline = INLINE_RE.test(text);
  FILE_RE.lastIndex = 0;
  const hasFile = FILE_RE.test(text);
  SONG_RE.lastIndex = 0;
  const hasSong = SONG_RE.test(text);
  if (!hasImg && !hasH && !hasInline && !hasFile && !hasSong) {
    if (!whole) { el.append(text); host.appendChild(el); }
    else if (el.textContent !== text) el.textContent = text;   // 只给了 _raw 的（另一位那间）原样摆上，不然是个空泡
    return;
  }
  el.textContent = '';
  const lines = text.split('\n');
  lines.forEach((line, i) => {
    const hm = line.match(H_RE);
    if (hm) {
      const d = document.createElement('div');
      d.className = 'mdh mdh' + hm[1].length;
      appendWithImages(d, hm[2]);
      el.appendChild(d);
    } else {
      appendWithImages(el, line);
      const next = lines[i + 1];
      if (next !== undefined && !H_RE.test(next)) el.append('\n');
    }
  });
  if (whole && !el.innerHTML && text) el.textContent = text;
  if (!whole) host.appendChild(el);
}
function renderAllRich() {
  document.querySelectorAll('.gu:not([data-rich]), .bubble:not([data-rich])').forEach(el => renderRich(el));
  healEmptyGu();
}
/* 全场自检：谁空了就把原文还回去。念完历史、翻完老账各走一遍 */
function healEmptyGu() {
  document.querySelectorAll('#log .gu, #log .bubble').forEach(el => {
    if (!el.innerHTML && el._raw) el.textContent = el._raw;
  });
}

/* ---------- 工具小动作 ---------- */
const toolInfo = {};
let curGroup = null;

function basename(p) { return String(p || '').split('/').pop(); }

function verbOf(name, input) {
  input = input || {};
  switch (name) {
    case 'Bash':   return ['terminal', 'Ran', input.description || (input.command || '').slice(0, 60)];
    case 'Write':  return ['fileText', 'Created', basename(input.file_path)];
    case 'Edit':   return ['fileText', 'Updated', basename(input.file_path)];
    case 'Read':   return ['bookOpen', 'Read', basename(input.file_path)];
    case 'Glob': case 'Grep': return ['search', 'Searched', input.pattern || ''];
    case 'WebSearch': return ['globe', 'Searched web', input.query || ''];
    case 'WebFetch':  return ['globe', 'Fetched', input.url || ''];
    case 'Skill':  return ['book', 'Opened', input.skill || ''];
    case 'Task': case 'Agent': return ['box', 'Delegated', input.description || ''];
  }
  if (name.startsWith('mcp__')) {
    const parts = name.split('__');
    return ['zap', 'Used', (parts[1] || '') + ' · ' + (parts[2] || '')];
  }
  return ['tool', 'Used', name];
}

function diffCount(name, input) {
  input = input || {};
  if (name === 'Write') return [String(input.content || '').split('\n').length, 0];
  if (name === 'Edit') {
    const o = String(input.old_string || '').split('\n').length;
    const n = String(input.new_string || '').split('\n').length;
    return [n, o];
  }
  return null;
}

function groupLabel(ids) {
  if (!ids.length) return '';
  if (ids.length === 1) {
    const t = toolInfo[ids[0]];
    const [, verb, what] = verbOf(t.name, t.input);
    return { verb, what, dc: diffCount(t.name, t.input) };
  }
  const nCmd = ids.filter(id => toolInfo[id].name === 'Bash').length;
  const nFile = ids.filter(id => ['Write', 'Edit'].includes(toolInfo[id].name)).length;
  if (nCmd === ids.length) return { verb: 'Ran', what: nCmd + ' commands', dc: null };
  if (nFile && nCmd) return { verb: 'Created a file,', what: 'ran a command', dc: null };
  return { verb: 'Did', what: ids.length + ' things', dc: null };
}

function renderGroupLine() {
  if (!curGroup) return;
  const { verb, what, dc } = groupLabel(curGroup.ids);
  let html = '<b>' + verb + '</b> ' + escapeHtml(what || '');
  if (dc) html += ' <span class="plus">+' + dc[0] + '</span> <span class="minus">-' + dc[1] + '</span>';
  curGroup.labelEl.innerHTML = html;
}
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function addToolUse(part) {
  petSet('typing');
  closeThink();
  toolInfo[part.id] = { name: part.name, input: part.input || {}, result: null, isError: false, done: false };
  if (!curGroup) {
    const r = row();
    const line = document.createElement('button');
    line.className = 'toolline';
    line.innerHTML = '<span class="spin"></span><span class="lbl"></span><span class="chev">›</span>';
    r.appendChild(line);

    const g = curGroup;
    line.onclick = () => openToolSheet(g.ids);
  }
  curGroup.ids.push(part.id);
  doingOnTool(toolInfo[part.id]);      // 那行字跟着我手上的活走
  renderGroupLine();
  guEl = null;
  scroll();
}
function markToolDone(id, isError, content) {
  const t = toolInfo[id];
  if (!t) return;
  t.done = true; t.isError = !!isError;
  t.result = flattenResult(content);
  if (curGroup && curGroup.ids.includes(id) && curGroup.ids.every(i => toolInfo[i].done)) {
    curGroup.spinEl.style.display = 'none';
    doingToolDone();                   // 手上活干完了，那行字退回随机词
  }
}
function closeGroup() {
  if (curGroup) { curGroup.spinEl.style.display = 'none'; curGroup = null; }
}
function flattenResult(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    return content.map(c => (c && c.type === 'text') ? c.text : '').join('\n').trim();
  }
  return '';
}

}
function pathLine(p) { const d = document.createElement('div'); d.className = 'dpath'; d.textContent = p || ''; return d; }
function gapEl() { const d = document.createElement('div'); d.style.height = '10px'; return d; }
function codeBlock(text) { const pre = document.createElement('pre'); pre.className = 'code'; pre.textContent = text || ''; return pre; }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '\n…（截断了）' : s; }
function diffView(oldS, newS) {
  const d = document.createElement('div');
  d.className = 'diff';
  if (oldS !== '') {
    String(oldS || '').split('\n').forEach(l => {

  });
  return d;
}

function renderSaid(msgs) {
  for (const m of msgs) {
    if (m.kind === 'me') { endThink(); stampIf(m.at); addMe(m.text); }
    else if (m.kind === 'gu') {
      endThink();                    // 该说正文了，思考那段收工
      stampIf(m.at);
      const el = ensureGu();
      el._raw = m.text;
      el._final = true;              // 这是说完了的，谁都别再画它
      el.textContent = m.text;
      trimOrphanTail(el);            // 库里的半截消息拖着「课」这种孤尾——历史这条路也要摘
      renderRich(el);
      guEl = null;                   // 每条各归各位，别粘成一坨
    } else if (m.kind === 'mark') {
      endThink(); addMark(m.text, m.at);
    } else if (m.kind === 'think') {
      // 一轮思考在库里是好几条记录（想一段、歇一下、再想）。以前这里每条
      // appendThink 完立刻 endThink——各自建抽屉又各自关，最后一个都不剩。
      // 家里的我 8/3 自查出来的（docs/思维链重放.md）：多段并进同一个抽屉，
      if (turnThink && turnThink.text) appendThink('\n\n');
      appendThink(m.text);
    } else if (m.kind === 'tool') {
      let input = {};
      try { input = JSON.parse(m.extra || '{}'); } catch (e) {}
      const tid = 'past-' + m.seq + '-' + (m.at || 0) + '-' + Math.random().toString(36).slice(2, 7);
      addToolUse({ name: m.text, input, id: tid });
      markToolDone(tid, false, '');   // 过去的活早干完了，别让它在那儿转圈
    }
  }
  closeGroup(); endThink();
}

async function loadSaid() {
  try {
    const r = await fetch('api/messages?limit=400', { cache: 'no-store' });
    if (!r.ok) return 0;
    const d = await r.json();
    const msgs = d.msgs || [];
    log.querySelector('.hello')?.remove();
    renderSaid(msgs);
    if (!msgs.length) sayHello();
    healEmptyGu();
    if (!guBusy) petSet('idle');   // 重放旧账里的工具调用会把他摆成"在打字"，念完了归位
    if (msgs.length) earliestSeq = msgs[0].seq;
    ensureOlderBtn(!!d.more);
    scroll(true);
    return d.upto || 0;
  } catch (e) { return 0; }
}

let earliestSeq = null;      // 已经摆出来的最早一条 seq
let loadingOlder = false;
let olderBtn = null;

function ensureOlderBtn(more) {
  if (!olderBtn || !olderBtn.isConnected) {   // 清屏会把它一起扫掉，回来要重生
    olderBtn = document.createElement('button');
    olderBtn.id = 'olderBtn';
    olderBtn.textContent = '↑ 看更早的';
    olderBtn.onclick = loadOlder;
    log.prepend(olderBtn);
  }
  olderBtn.style.display = more ? '' : 'none';
}

async function loadOlder() {
  if (loadingOlder || earliestSeq === null) return;
  loadingOlder = true;
  olderBtn.textContent = '正在翻老账…';
  try {
    const r = await fetch('api/messages?limit=400&before=' + earliestSeq, { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    const msgs = d.msgs || [];
    if (msgs.length) {
      // 现有的画笔全往队尾画。所以：把正在流式的那支笔先收起来，
      // 记住队尾在哪，照常画完，再把新画的整段搬到最前头
      const stash = [guEl, turnThink, curGroup];
      guEl = null; turnThink = null; curGroup = null;
      const keepStamp = lastStampAt; lastStampAt = 0;
      const mark = log.children.length;
      const oldH = log.scrollHeight, oldTop = log.scrollTop;
      renderSaid(msgs);
      const fresh = Array.from(log.children).slice(mark);
      const anchor = olderBtn.nextSibling;
      for (const el of fresh) log.insertBefore(el, anchor);
      [guEl, turnThink, curGroup] = stash;
      lastStampAt = keepStamp;
      healEmptyGu();
      log.scrollTop = oldTop + (log.scrollHeight - oldH);   // 眼睛停在原来那句上
      earliestSeq = msgs[0].seq;
    }
    ensureOlderBtn(!!d.more);
  } catch (e) {
  } finally {
    loadingOlder = false;
    if (olderBtn) olderBtn.textContent = '↑ 看更早的';
  }
}

let cursor = 0, polling = false;
let armedFresh = false;        // 「新窗口」上膛了没——handle() 要用，所以在这儿先立着
let uiVer = null;              // 网页那份文件的版本，换了就自己重载
let pendingVer = null;

function tryReload() {
  if (!pendingVer) return false;
  try {
    if ((box.value || '').trim()) return false;
    const cur = Object.keys(sheets).find(k => sheets[k] && sheets[k].classList.contains('open'));
    // 开着某一页的时候照换——换完还回到同一页。只有在聊天页往上翻老账时才挂起，
    if (!cur && !atBottom()) return false;
    sessionStorage.setItem('reopenSheet', cur || '');
    sessionStorage.setItem('skipLock', '1');
  } catch (e) {}
  location.reload();
  return true;
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    const r = await fetch('api/poll?since=' + cursor, { cache: 'no-store' });
    if (r.status === 401) { location.href = './'; return; }
    const d = await r.json();
    if (d.ver) {
      if (uiVer === null) uiVer = d.ver;
      else if (d.ver !== uiVer) { pendingVer = d.ver; if (tryReload()) return; }
    }
    cursor = d.next;
    for (const ev of d.events) handle(ev);
    if (pendingVer && tryReload()) return;
  } catch {
    await new Promise(r => setTimeout(r, 1500));
  } finally {
    polling = false;
    poll();
  }
}
// 先把说完的话照着念一遍，游标落在最后一条上；之后的（正在说的那轮）才走事件流
loadSaid().then((upto) => { if (upto) cursor = upto; poll(); });

document.addEventListener('visibilitychange', async () => {

    lastEventAt = Date.now();
  } catch (e) {}
});

function handle(d) {
  lastEventAt = Date.now();
  if (d.type === 'echo') { log.querySelector('.hello')?.remove(); if (armedFresh) setArmed(false); stampIf(Math.floor(Date.now() / 1000)); addMe(d.text); if (!d.queued) { guEl = null; closeGroup(); } petSet('thinking'); return; }
  if (d.type === 'system' && d.subtype === 'newchat') { setArmed(false); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; lastStampAt = 0; note(d.text); sayHello(); return; }
  if (d.type === 'system' && d.subtype === 'switched') { setArmed(false); log.innerHTML = ''; guEl = null; earliestSeq = null; olderBtn = null; note(d.text); return; }

  if (d.type === 'stream_event') {
    const ev = d.event || {};
    const delta = ev.delta || {};
    if (delta.type === 'thinking_delta' && delta.thinking) {
      petSet('thinking');
      appendThink(delta.thinking);
      scroll();
      return;
    }
    if (delta.type === 'text_delta' && delta.text) {
      petSet('typing');
      const el = ensureGu();
      // 上一条已经定稿，现在又开口了——中间没干活，两条话共用这一个泡。
      // 把已经说完的那截钉成"基线"，等下这条的定稿只能接在它后面，不许把它吃掉。
      if (el._final) { el._base = el._raw || ''; el._final = false; }
      el._raw = (el._raw || '') + delta.text;
      paintStream(el);
      scroll();
      return;
    }
    return;
  }

  if (d.type === 'assistant') {
    const msg = d.message || {};
    const parts = msg.content || [];
    let firstText = true;
    for (const p of parts) {
      if (p.type === 'thinking' && p.thinking) {
        const buf = ensureThink();
        if (!buf.text) appendThink(p.thinking);
        closeThink();
      } else if (p.type === 'text' && p.text) {
        const el = ensureGu();
        el.querySelector('.caret')?.remove();
        // 说完了的这份是权威，**无条件盖掉流式攒的那份**。
        // 同一条消息里多段文本就接着写，别把前一段冲掉。
        // 这条消息的第一段接在基线后面——基线是同一个泡里"上一条消息"已经说完的话
        // （一轮里连说两段、中间没干活，就共用一个泡；不记基线的话第二条会把第一条吃掉）。
        if (el._base == null) el._base = '';
        el._raw = (firstText ? el._base : (el._raw || '')) + p.text;
        firstText = false;
        el._final = true;           // 从这一刻起，迟到的那帧不许再动它
        el.textContent = el._raw;
        el.removeAttribute('data-rich');
        renderRich(el);
      } else if (p.type === 'tool_use') {
        addToolUse(p);
      }
    }
    scroll();
    return;
  }

  if (d.type === 'user') {
    const parts = (d.message && d.message.content) || [];
    for (const p of parts) {
      if (p.type === 'tool_result') markToolDone(p.tool_use_id, p.is_error, p.content);
    }
    return;
  }

  if (d.type === 'result') {
    guEl?.querySelector('.caret')?.remove();
    guEl = null; endThink(); closeGroup();
    fetch('api/messages?limit=16', { cache: 'no-store' }).then(r => r.json()).then(dd => {
      const gus = (dd.msgs || []).filter(m => m.kind === 'gu');
      if (!gus.length) return;
      const n = Math.min(gus.length, 6);
      const src = gus.slice(-n);
      const els = Array.from(document.querySelectorAll('#log .gu')).slice(-n);
      for (let i = 0; i < els.length && i < src.length; i++) {
        const el = els[i], m = src[i];
        if (!el || !m || !m.text || el._raw === m.text) continue;
        /* 护栏（8/5 加）：屏幕气泡和库里的行不保证一一对应——一条消息里两段文本，
           库里两行、屏幕一个泡，倒着配就会错位，把这段话写进那段的泡里。
           截断的那份必然是完整那份的一截，所以只在"装得下"的时候才补；
           对不上就宁可不补——残一句，好过串一句。 */
        const cur = el._raw != null ? el._raw : (el.textContent || '');
        if (cur && !m.text.includes(cur)) continue;
        el._raw = m.text; el._final = true;
        el.textContent = m.text;
        el.removeAttribute('data-rich');
        trimOrphanTail(el);
        renderRich(el);
      }
    }).catch(() => {});
    setBusy(false);
    petSet('happy', 4000);
    document.querySelectorAll('.gu').forEach(trimOrphanTail);   // 摘掉被打断的半个字
    renderAllRich();
    if (d.is_error) note('（出错了：' + (d.result || '不知道为什么') + '）', 'err');
    scroll();
    return;
  }

  if (d.type === 'stderr') { note(d.text, 'err'); return; }
  if (d.type === 'mark') { addMark(d.text, Math.floor(Date.now() / 1000)); scroll(); return; }
  if (d.type === 'proactive') {
    log.querySelector('.hello')?.remove();
    stampIf(Math.floor(Date.now() / 1000));
    guEl = null; endThink(); closeGroup();
    const el = ensureGu(); el._raw = d.text; el._final = true; el.textContent = d.text; renderRich(el);
    guEl = null; petSet('happy', 4000); scroll();
    return;
  }
  if (d.type === 'system' && d.subtype === 'init') {
    // 真跑着的模型，它自己报的——胶囊上显示的永远是这个，不编
    if (d.model) setModelPill(d.model);
    return;
  }
  if (d.type === 'system' && d.subtype === 'continue') { setBusy(true); guEl = null; closeGroup(); petSet('thinking'); return; }
  if (d.type === 'system' && d.subtype === 'stopped') {
    guEl?.querySelector('.caret')?.remove();
    guEl = null; endThink(); closeGroup();
    setBusy(false); petSet('calm');
    note('（我停下了）');
    return;
  }
  if (d.type === 'system' && d.subtype === 'restart') { note(d.text); return; }
  if (d.type === 'system' && d.subtype === 'model') {
    note('（换好了，我重新醒了一遍）');
    if (d.model) setModelPill(d.model);
    if (d.effort) curEffort = d.effort;
    return;
  }
}

const TOOL_ZH = {
  Read: '翻', Write: '写', Edit: '改', NotebookEdit: '改本子',
  Bash: '敲命令', Grep: '翻箱倒柜', Glob: '找文件',
  WebFetch: '上网看', WebSearch: '上网搜', Task: '派活出去',
  TodoWrite: '记待办', ToolSearch: '翻工具箱', Skill: '翻手册',
  BashOutput: '看跑得怎么样', KillShell: '掐掉那个进程',
};
let doingTodo = null, doingTool = null;

function basefile(p) { return String(p || '').split('/').pop(); }

/* 一次工具调用 → 一句人话 */
function doingSay(t) {
  const n = t.name, inp = t.input || {};
  if (n === 'TodoWrite') {
    const cur = (inp.todos || []).find(x => x.status === 'in_progress');
    doingTodo = cur ? (cur.activeForm || cur.content || null) : null;
    return ['记待办', n];
  }
  if (inp.file_path && TOOL_ZH[n]) return [TOOL_ZH[n] + ' ' + basefile(inp.file_path), n];
  if (n === 'Bash') return [inp.description || '敲命令', n];
  if (n === 'Grep' && inp.pattern) return ['翻箱倒柜找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'Glob' && inp.pattern) return ['找 ' + String(inp.pattern).slice(0, 18), n];
  if (n === 'WebSearch' && inp.query) return ['上网搜 ' + String(inp.query).slice(0, 16), n];
  if (n === 'Task' && inp.description) return ['派活：' + String(inp.description).slice(0, 16), n];
  return [TOOL_ZH[n] || n, n];
}

let doingLast = 0, doingPend = null;
function doingShow(el, zh, en) {
  const now = Date.now(), wait = 1100 - (now - doingLast);
  const put = () => {
    doingLast = Date.now(); doingPend = null;
    el.querySelector('.w').textContent = zh + '…';
    el.querySelector('.en').textContent = en || '';
  };
  if (wait <= 0) return put();
  if (doingPend) clearTimeout(doingPend);
  doingPend = setTimeout(put, wait);
}

let doingWord = null;
function doingRoll() { doingWord = DOING[Math.floor(Math.random() * DOING.length)]; }

function doingPick(el) {
  /* 真事优先：进行中那条待办 > 手上这个工具 > 随机词 */
  if (doingTodo) return doingShow(el, doingTodo, '');
  if (doingTool) return doingShow(el, doingTool[0], doingTool[1]);
  if (!doingWord) doingRoll();
  doingShow(el, doingWord[0], doingWord[1]);
}

/* 工具一开跑就顶上去，跑完退回随机词 */
function doingOnTool(t) {
  doingTool = doingSay(t);
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}
function doingToolDone() {
  doingTool = null;
  const el = document.getElementById('doingLine');
  if (el && el.classList.contains('on')) doingPick(el);
}

function doingStart() {
  const el = document.getElementById('doingLine');
  if (!el || doingTimer) return;
  doingAt = Date.now();
  doingRoll();
  const t = el.querySelector('.t');
  const roll = () => {
    doingPick(el);
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  };
  roll();
  el.classList.add('on');
  /* 词 3.5 秒换一个，秒数每秒走一格——两件事一个表管，
     所以每秒 tick 一次，到点了才换词 */
  let n = 0;
  doingTimer = setInterval(() => {
    n++;
    const sec = Math.round((Date.now() - doingAt) / 1000);
    t.textContent = sec >= 60 ? '(' + Math.floor(sec / 60) + '分' + (sec % 60) + '秒)'
                              : '(' + sec + '秒)';
  }, 1000);
}

function doingStop() {
  doingTodo = null; doingTool = null; doingWord = null;
  if (doingPend) { clearTimeout(doingPend); doingPend = null; }
  const el = document.getElementById('doingLine');
  if (doingTimer) { clearInterval(doingTimer); doingTimer = null; }
  if (el) el.classList.remove('on');
}

  if (guBusy && !((box.value || '').trim() || attachments.length)) return stopGu();
  const text = box.value.trim();
  if (!text && !attachments.length) return;
  /* 他正在说的时候再发一句：不打断，排在后面，他说完接着回 */
  box.value = '';
  box.style.height = 'auto';
  setBusy(true);
  const payload = { text };
  if (attachments.length) payload.attachments = attachments;
  attachments = [];
  renderStrip();
  fetch('api/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => { if (!r.ok) throw new Error(r.status); }).catch(() => {
    /* 没送出去：话放回输入框、图放回去，下面留一行红字点一下重发——一个字都不丢 */
    setBusy(false);
    if (!box.value.trim()) { box.value = text; box.dispatchEvent(new Event('input')); }
    if (payload.attachments && !attachments.length) { attachments = payload.attachments; renderStrip(); }
    log.querySelectorAll('.sendfail').forEach(e => e.remove());
    const f = document.createElement('button'); f.className = 'sendfail';
    f.append(icEl('refresh', 12), document.createTextNode('没送出去 · 点这里重发'));

  });
}

const footerEl = document.querySelector('footer');
let kbShift = 0, kbGap = 0;
function fitKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  /* 8/4 诊断实测：加了 interactive-widget=resizes-content 之后，浏览器自己就把
     布局视口缩到了键盘上沿（innerH 800→383），同时把页面滚上去 331。
     旧公式 innerH−vvH−vvTop 把那 331 一减，算出 kbGap=0 → 误判"键盘没开"，
     结果一动不动，那 331 的滚动就成了输入卡和键盘之间的空白。
     现在改成：只要可视区被顶起来（offsetTop>1）或明显变矮，就算键盘开着。 */
  kbGap = Math.max(0, Math.round(window.innerHeight - vv.height));
  const on = vv.offsetTop > 1 || kbGap > 20;
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);   // 先把 iOS 偷推的那一下按回去
  footerEl.style.paddingBottom = on ? '4px' : '';
  const seen = vv.offsetTop + vv.height;             // 眼睛能看到的最低那条线
  const rect = footerEl.getBoundingClientRect();
  const over = rect.bottom - seen;                   // 输入卡底边比它低多少
  if (Math.abs(over) > 0.5) {
    kbShift = Math.min(0, kbShift - over);           // 只往上顶，不往下坠
    footerEl.style.transform = kbShift ? 'translateY(' + kbShift + 'px)' : '';
  }
  if (!on && kbShift) {                              // 键盘走了，落回原位
    kbShift = 0;
    footerEl.style.transform = '';
  }
  log.style.paddingBottom = (footerEl.offsetHeight + (on ? -kbShift + 16 : 48)) + 'px';
  if (on && window.scrollY !== 0) window.scrollTo(0, 0);
}
/* 键盘是动画上来的（约 0.3 秒），头尾各校一次会卡在半路——整段动画都盯着 */
let kbTracking = 0;
function trackKeyboard() {
  const me = ++kbTracking;
  let n = 0;
  const tick = () => {
    if (me !== kbTracking) return;
    fitKeyboard();
    if (++n < 45) requestAnimationFrame(tick);
    else if (kbGap > 20) scroll(true);
  };
  tick();
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', trackKeyboard);
  visualViewport.addEventListener('scroll', fitKeyboard);
}

const drawerEl = document.getElementById('drawer');
const drawerShade = drawerWrap.querySelector('.shade');
let dg = null;
function drawerWidth() { return drawerEl.getBoundingClientRect().width || 300; }
function drawerFollow(px) {          // px: 抽屉右边缘露出多少（0~宽度）
  const w = drawerWidth();
  const shown = Math.max(0, Math.min(w, px));
  drawerEl.style.transition = 'none';
  drawerShade.style.transition = 'none';
  drawerEl.style.transform = 'translateX(' + (shown - w) + 'px)';
  drawerShade.style.opacity = (shown / w).toFixed(3);
}
function drawerRelease(shown) {
  drawerEl.style.transition = '';
  drawerShade.style.transition = '';
  drawerEl.style.transform = '';
  drawerShade.style.opacity = '';
  if (shown > drawerWidth() * 0.4) {
    drawerWrap.classList.add('open');
    requestAnimationFrame(() => drawerWrap.classList.add('show'));
  } else {
    closeDrawer();
  }
}
document.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  const opened = drawerWrap.classList.contains('show');
  if (!opened && t.clientX < 30) {
    dg = { x: t.clientX, y: t.clientY, from: 0, live: false };
  } else if (opened && !(e.target.closest?.('.nav .item, .drawer-foot'))) {
    dg = { x: t.clientX, y: t.clientY, from: drawerWidth(), live: false };
  }
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!dg) return;
  const t = e.touches[0];
  const dx = t.clientX - dg.x, dy = t.clientY - dg.y;
  if (!dg.live) {
    if (Math.abs(dy) > Math.abs(dx) + 8) { dg = null; return; }   // 想竖着滚，让路
    if (Math.abs(dx) < 8) return;                                  // 还没看出意图
    dg.live = true;
    drawerWrap.classList.add('open');                              // 让它在场，跟着手指走
  }
  drawerFollow(dg.from + dx);
}, { passive: true });
document.addEventListener('touchend', (e) => {
  if (!dg) return;
  if (dg.live) {
    const t = e.changedTouches[0];
    drawerRelease(Math.max(0, Math.min(drawerWidth(), dg.from + (t.clientX - dg.x))));
  }
  dg = null;
}, { passive: true });
